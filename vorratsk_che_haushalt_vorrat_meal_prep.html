    // =========================================================================
    // 4. HILFSFUNKTIONEN (TEXT, ZAHLEN, EINHEITEN-UMRECHNUNG)
    // =========================================================================

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function normalizeName(name) {
      return String(name || '').trim().toLowerCase().replace(/\s+/g, ' ');
    }

    function generateId(prefix = 'id') {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) {
        return `${prefix}-${crypto.randomUUID().slice(0, 8)}`;
      }
      return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`;
    }

    /** Formatiert Zahlen sauber nach deutschem Standard (z. B. 1.200 oder 1,5) */
    function formatNumberDE(num, maxDecimals = 1) {
      const rounded = Math.round(num * Math.pow(10, maxDecimals)) / Math.pow(10, maxDecimals);
      return rounded.toLocaleString('de-DE', {
        minimumFractionDigits: 0,
        maximumFractionDigits: maxDecimals,
      });
    }

    /** Rundet Grammzahlen praxisnah (ganze Gramm ab 10g, 1 Dezimalstelle bei kleinen Mengen) */
    function cleanGrams(grams) {
      if (grams >= 10) return Math.round(grams);
      return Math.round(grams * 10) / 10;
    }

    /**
     * Berechnet eine sinnvolle TL/EL-Angabe für eine Zutat.
     * Gibt null zurück, wenn Löffel für diese Zutat oder Menge keinen Sinn ergeben.
     */
    function getSpoonConversion(grams, ingredientName) {
      if (!grams || grams <= 0 || !ingredientName) return null;
      const norm = normalizeName(ingredientName);
      const entry = SPOON_CONVERSIONS.find((rule) =>
        rule.keywords.some((kw) => norm === kw || norm.includes(kw))
      );
      if (!entry) return null;
      if (grams > entry.maxGrams) return null;

      // Sehr kleine Gewürzmenge (z. B. 1 g Muskatnuss bei 1 TL = 3 g)
      const tlExact = grams / entry.tl;
      if (tlExact < 0.4) {
        if (tlExact >= 0.2) return '⅓ TL';
        return '1 Prise';
      }

      // Entscheide ob EL oder TL sinnvoller ist
      const elExact = grams / entry.el;
      if (elExact >= 0.9) {
        const elRounded = Math.round(elExact * 2) / 2;
        if (elRounded <= 8) {
          return `${formatNumberDE(elRounded, 1)} EL`;
        }
        return null;
      }

      const tlRounded = Math.round(tlExact * 2) / 2;
      if (tlRounded > 0 && tlRounded <= 6) {
        return `${formatNumberDE(tlRounded, 1)} TL`;
      }
      return null;
    }

    /**
     * Rendert eine Menge als HTML: Immer exakt in Gramm/ml, optional mit schönem TL/EL-Badge.
     */
    function formatAmountHTML(grams, ingredientName, showSpoons = state.showSpoons, unit = 'g') {
      const g = cleanGrams(grams);
      const u = unit || 'g';
      const gStr = `${formatNumberDE(g, g < 10 ? 1 : 0)} ${u}`;
      if (!showSpoons) return `<span class="font-semibold tabular-nums">${gStr}</span>`;
      const spoon = getSpoonConversion(g, ingredientName);
      if (!spoon) return `<span class="font-semibold tabular-nums">${gStr}</span>`;
      return `<span class="font-semibold tabular-nums">${gStr}</span> <span class="text-xs font-medium text-sage-700 bg-sage-100/90 px-1.5 py-0.5 rounded-md ml-0.5 whitespace-nowrap">(${spoon})</span>`;
    }

    /** Reiner Text für Tooltips / Zusammenfassungen */
    function formatAmountText(grams, ingredientName, showSpoons = state.showSpoons, unit = 'g') {
      const g = cleanGrams(grams);
      const u = unit || 'g';
      const gStr = `${formatNumberDE(g, g < 10 ? 1 : 0)} ${u}`;
      if (!showSpoons) return gStr;
      const spoon = getSpoonConversion(g, ingredientName);
      return spoon ? `${gStr} (${spoon})` : gStr;
    }

    function getBaseById(id) {
      return state.bases.find((b) => b.id === id) || null;
    }

    function getRecipeById(id) {
      return state.recipes.find((r) => r.id === id) || null;
    }

    function getPantryItemByName(name) {
      const norm = normalizeName(name);
      return state.pantry.find((p) => normalizeName(p.name) === norm) || null;
    }

    function getPantryGrams(name) {
      const item = getPantryItemByName(name);
      return item ? Number(item.amountGrams) || 0 : 0;
    }

    /** Liefert alle bekannten Zutatennamen (für Autocomplete in Formularen) */
    function getAllKnownIngredientNames() {
      const map = new Map();
      state.pantry.forEach((p) => map.set(normalizeName(p.name), p.name));
      state.bases.forEach((b) => (b.ingredients || []).forEach((i) => map.set(normalizeName(i.name), i.name)));
      state.recipes.forEach((r) => (r.ingredients || []).forEach((i) => map.set(normalizeName(i.name), i.name)));
      return Array.from(map.values()).sort((a, b) => a.localeCompare(b, 'de'));
    }

    // =========================================================================
    // 5. KERN-BERECHNUNGEN (MEAL-PREP-BASEN, VORRAT-MATCH, EINKAUFSLISTE)
    // =========================================================================

    /**
     * Berechnet die benötigten Zutaten eines Rezepts für eine gegebene Portionszahl.
     * Gibt getrennt Hauptzutaten, skalierte Basis-Menge und (falls gewünscht) Basis-Zutaten zurück.
     */
    function getScaledRecipeDetails(recipe, servings = recipe.defaultServings) {
      const factor = (Number(servings) || recipe.defaultServings || 4) / (recipe.defaultServings || 4);
      const base = recipe.baseId ? getBaseById(recipe.baseId) : null;
      const scaledBaseGrams = base ? (Number(recipe.baseAmountGrams) || base.yieldGrams || 400) * factor : 0;
      const baseScaleFactor = base && base.yieldGrams > 0 ? scaledBaseGrams / base.yieldGrams : 0;

      const baseIngredients = base
        ? (base.ingredients || []).map((ing) => ({
            ...ing,
            amountGrams: (Number(ing.amountGrams) || 0) * baseScaleFactor,
          }))
        : [];

      const mainIngredients = (recipe.ingredients || []).map((ing) => ({
        ...ing,
        amountGrams: (Number(ing.amountGrams) || 0) * factor,
      }));

      return {
        factor,
        base,
        scaledBaseGrams,
        baseScaleFactor,
        baseIngredients,
        mainIngredients,
      };
    }

    /**
     * Analysiert alle im Wochenplan genutzten Rezept-Basen für den Meal-Prep-Banner.
     */
    function computeWeeklyBaseAnalysis() {
      const map = new Map(); // baseId -> { base, totalGrams, meals: [{ meal, recipe, baseGrams }], isPrepped }

      state.mealPlan.forEach((meal) => {
        const recipe = getRecipeById(meal.recipeId);
        if (!recipe || !recipe.baseId) return;
        const base = getBaseById(recipe.baseId);
        if (!base) return;

        const details = getScaledRecipeDetails(recipe, meal.servings);
        if (!map.has(base.id)) {
          map.set(base.id, {
            base,
            totalGrams: 0,
            meals: [],
            isPrepped: Boolean(state.preppedBases[base.id]),
          });
        }
        const entry = map.get(base.id);
        entry.totalGrams += details.scaledBaseGrams;
        entry.meals.push({ meal, recipe, baseGrams: details.scaledBaseGrams });
      });

      // Aggregierte Zutaten pro Gesamt-Batch berechnen
      const results = Array.from(map.values()).map((entry) => {
        const batchFactor = entry.base.yieldGrams > 0 ? entry.totalGrams / entry.base.yieldGrams : 1;
        const batchIngredients = (entry.base.ingredients || []).map((ing) => ({
          ...ing,
          amountGrams: (Number(ing.amountGrams) || 0) * batchFactor,
        }));
        return {
          ...entry,
          batchIngredients,
          isShared: entry.meals.length >= 2,
        };
      });

      // Mehrfach geteilte Basen zuerst, dann nach Gesamtmenge absteigend
      results.sort((a, b) => {
        if (a.isShared !== b.isShared) return a.isShared ? -1 : 1;
        return b.totalGrams - a.totalGrams;
      });

      return results;
    }

    /**
     * Berechnet den Vorrats-Match eines Rezepts (inkl. Basis-Zutaten, sofern Basis nicht vorgekocht ist).
     */
    function computeRecipePantryMatch(recipe, servings = recipe.defaultServings) {
      const details = getScaledRecipeDetails(recipe, servings);
      const neededMap = new Map(); // normName -> { name, needed }

      const addIng = (ing) => {
        const norm = normalizeName(ing.name);
        if (!norm) return;
        const prev = neededMap.get(norm) || { name: ing.name, needed: 0 };
        prev.needed += Number(ing.amountGrams) || 0;
        neededMap.set(norm, prev);
      };

      details.mainIngredients.forEach(addIng);
      if (details.base && !state.preppedBases[details.base.id]) {
        details.baseIngredients.forEach(addIng);
      }

      const items = Array.from(neededMap.values());
      if (items.length === 0) {
        return { percent: 100, fullyCovered: 0, total: 0 };
      }

      let scoreSum = 0;
      let fullyCovered = 0;

      items.forEach((item) => {
        const have = getPantryGrams(item.name);
        if (have >= item.needed - 0.01) {
          scoreSum += 1;
          fullyCovered += 1;
        } else if (have > 0 && item.needed > 0) {
          scoreSum += have / item.needed;
        }
      });

      return {
        percent: Math.round((scoreSum / items.length) * 100),
        fullyCovered,
        total: items.length,
      };
    }

    /**
     * Erstellt intelligente Rezept-Vorschläge sortiert nach Vorrat-Match und Meal-Prep-Synergie.
     */
    function computeRecipeSuggestions() {
      // Welche Basen sind bereits im Wochenplan und an welchen Tagen?
      const plannedBaseDays = new Map(); // baseId -> [day, ...]
      const plannedRecipeIds = new Set();

      state.mealPlan.forEach((meal) => {
        plannedRecipeIds.add(meal.recipeId);
        const rec = getRecipeById(meal.recipeId);
        if (rec && rec.baseId) {
          const arr = plannedBaseDays.get(rec.baseId) || [];
          if (!arr.includes(meal.day)) arr.push(meal.day);
          plannedBaseDays.set(rec.baseId, arr);
        }
      });

      const list = state.recipes.map((recipe) => {
        const match = computeRecipePantryMatch(recipe);
        const base = recipe.baseId ? getBaseById(recipe.baseId) : null;
        const synergyDays = recipe.baseId ? plannedBaseDays.get(recipe.baseId) || [] : [];
        const hasSynergy = synergyDays.length > 0;
        const alreadyPlanned = plannedRecipeIds.has(recipe.id);

        // Kombi-Score: Vorrat-Match + 35 Punkte Bonus für Meal-Prep-Synergie, leichte Abwertung wenn bereits diese Woche eingeplant
        const comboScore = match.percent + (hasSynergy ? 35 : 0) - (alreadyPlanned ? 20 : 0);

        return {
          recipe,
          base,
          match,
          synergyDays,
          hasSynergy,
          alreadyPlanned,
          comboScore,
        };
      });

      list.sort((a, b) => {
        if (state.suggestionSort === 'pantry') {
          return b.match.percent - a.match.percent || (b.hasSynergy ? 1 : 0) - (a.hasSynergy ? 1 : 0);
        }
        if (state.suggestionSort === 'synergy') {
          if (a.hasSynergy !== b.hasSynergy) return a.hasSynergy ? -1 : 1;
          return b.match.percent - a.match.percent;
        }
        return b.comboScore - a.comboScore;
      });

      return list;
    }

    /**
     * Generiert die Einkaufsliste live aus dem Wochenplan inkl. exaktem Abgleich mit dem Vorrat.
     */
    function computeShoppingList() {
      const aggregated = new Map(); // normName -> { normName, name, category, neededGrams, sources: Set<string> }
      const skippedPreppedBases = new Map(); // baseId -> base

      const addIngredient = (ing, sourceLabel) => {
        const norm = normalizeName(ing.name);
        if (!norm) return;
        if (!aggregated.has(norm)) {
          const pantryRef = getPantryItemByName(ing.name);
          aggregated.set(norm, {
            normName: norm,
            name: pantryRef ? pantryRef.name : ing.name.trim(),
            category: ing.category || (pantryRef ? pantryRef.category : 'Trockenvorrat'),
            unit: ing.unit || (pantryRef ? pantryRef.unit : 'g') || 'g',
            neededGrams: 0,
            sources: new Set(),
          });
        }
        const entry = aggregated.get(norm);
        entry.neededGrams += Number(ing.amountGrams) || 0;
        if (sourceLabel) entry.sources.add(sourceLabel);
      };

      state.mealPlan.forEach((meal) => {
        const recipe = getRecipeById(meal.recipeId);
        if (!recipe) return;
        const details = getScaledRecipeDetails(recipe, meal.servings);

        details.mainIngredients.forEach((ing) => addIngredient(ing, recipe.name));

        if (details.base) {
          if (state.preppedBases[details.base.id]) {
            skippedPreppedBases.set(details.base.id, details.base);
          } else {
            details.baseIngredients.forEach((ing) => addIngredient(ing, `${details.base.name} (${recipe.name})`));
          }
        }
      });

      const toBuy = [];
      const fromPantry = [];

      aggregated.forEach((entry) => {
        const pantryGrams = getPantryGrams(entry.name);
        const needed = cleanGrams(entry.neededGrams);
        const deficit = cleanGrams(Math.max(0, needed - pantryGrams));
        const isForced = Boolean(state.forceBuy[entry.normName]);

        const enriched = {
          ...entry,
          neededGrams: needed,
          pantryGrams: cleanGrams(pantryGrams),
          buyGrams: deficit > 0 ? deficit : needed, // Bei "Doch kaufen" die volle benötigte Menge anzeigen
          status: deficit === 0 ? (isForced ? 'forced' : 'covered') : (pantryGrams > 0 ? 'partial' : 'missing'),
          checked: Boolean(state.checkedShopping[entry.normName]),
          sourcesList: Array.from(entry.sources),
        };

        if (deficit > 0 || isForced) {
          toBuy.push(enriched);
        } else {
          fromPantry.push(enriched);
        }
      });

      // Sortieren nach Kategorie & Name für schnelles Einkaufen
      const sortByCatAndName = (a, b) => {
        const catDiff = PANTRY_CATEGORIES.indexOf(a.category) - PANTRY_CATEGORIES.indexOf(b.category);
        if (catDiff !== 0) return catDiff;
        return a.name.localeCompare(b.name, 'de');
      };

      toBuy.sort(sortByCatAndName);
      fromPantry.sort(sortByCatAndName);

      return {
        toBuy,
        fromPantry,
        skippedPreppedBases: Array.from(skippedPreppedBases.values()),
      };
    }

    // =========================================================================
    // 6. PERSISTENZ-LAYER (FIREBASE FIRESTORE + LOKALER FALLBACK)
    // =========================================================================

    function userCol(colName) {
      return collection(db, 'artifacts', appId, 'users', currentUser.uid, colName);
    }

    function userDoc(colName, docId) {
      return doc(db, 'artifacts', appId, 'users', currentUser.uid, colName, docId);
    }

    async function persistDoc(colName, docId, payload) {
      if (state.storageMode !== 'cloud' || !db || !currentUser) return;
      try {
        await setDoc(userDoc(colName, docId), payload);
      } catch (err) {
        console.error(`Fehler beim Speichern (${colName}/${docId}):`, err);
        showToast('Änderung lokal aktiv (Cloud-Sync gerade nicht erreichbar)', 'warn');
      }
    }

    async function removeDoc(colName, docId) {
      if (state.storageMode !== 'cloud' || !db || !currentUser) return;
      try {
        await deleteDoc(userDoc(colName, docId));
      } catch (err) {
        console.error(`Fehler beim Löschen (${colName}/${docId}):`, err);
      }
    }

    async function persistSettings() {
      await persistDoc('appMeta', 'settings_v3', {
        preppedBases: state.preppedBases,
        forceBuy: state.forceBuy,
        checkedShopping: state.checkedShopping,
        showSpoons: state.showSpoons,
        updatedAt: Date.now(),
      });
    }

    /** Einmaliges Befüllen bzw. Migration auf Daten-Version v3 (10 Basen & 13 Rezepte aus rezepte_mealprep-v3.csv) */
    async function seedCloudIfEmpty() {
      const v3Ref = userDoc('appMeta', 'vorratskueche_v3_state');
      const v3Snap = await getDoc(v3Ref);
      if (v3Snap.exists() && v3Snap.data()?.version >= 3) return;

      // Alte Demo-Dokumente (z. B. v1) sauber entfernen, damit v3-Daten sofort & exklusiv aktiv sind
      const colsToClear = ['pantry', 'bases', 'recipes', 'mealPlan'];
      const clearPromises = [];
      for (const colName of colsToClear) {
        const snap = await getDocs(userCol(colName));
        snap.docs.forEach((d) => clearPromises.push(deleteDoc(d.ref)));
      }
      if (clearPromises.length > 0) {
        await Promise.all(clearPromises);
      }

      const seed = getSeedData();
      const writes = [];

      seed.bases.forEach((b) => writes.push(setDoc(userDoc('bases', b.id), b)));
      seed.recipes.forEach((r) => writes.push(setDoc(userDoc('recipes', r.id), r)));
      seed.pantry.forEach((p) => writes.push(setDoc(userDoc('pantry', p.id), p)));
      seed.mealPlan.forEach((m) => writes.push(setDoc(userDoc('mealPlan', m.id), m)));
      writes.push(
        setDoc(userDoc('appMeta', 'settings_v3'), {
          preppedBases: {},
          forceBuy: {},
          checkedShopping: {},
          showSpoons: true,
          updatedAt: Date.now(),
        })
      );
      writes.push(setDoc(v3Ref, { seeded: true, version: 3, source: 'rezepte_mealprep-v3.csv', createdAt: Date.now() }));

      await Promise.all(writes);
    }

    /** Abonniert alle Collections in Echtzeit (ohne komplexe Queries) */
    function attachFirestoreListeners() {
      unsubscribers.forEach((fn) => fn());
      unsubscribers = [];

      const onErr = (label) => (err) => {
        console.error(`Firestore Listener Fehler (${label}):`, err);
      };

      unsubscribers.push(
        onSnapshot(userCol('pantry'), (snap) => {
          state.pantry = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          renderApp();
        }, onErr('pantry'))
      );

      unsubscribers.push(
        onSnapshot(userCol('bases'), (snap) => {
          state.bases = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          renderApp();

    /** Erzeugt Vorschau-Objekte anhand des aktuellen Spalten-Mappings */
    function buildImportPreview(importData) {
      if (!importData || importData.fileKind !== 'csv') return [];
      const { targetType, dataRows, mapping } = importData;

      if (targetType === 'pantry') {
        const items = [];
        dataRows.forEach((row) => {
          const name = mapping.name >= 0 ? (row[mapping.name] || '').trim() : '';
          if (!name) return;
          const rawAmount = mapping.amountGrams >= 0 ? row[mapping.amountGrams] : '100';
          const numMatch = String(rawAmount || '').match(/(\d+(?:[.,]\d+)?)\s*([a-zA-ZäöüÄÖÜß]*)/);
          const amountGrams = numMatch ? convertToGrams(numMatch[1], numMatch[2] || 'g', name) : 100;
          const rawCat = mapping.category >= 0 ? (row[mapping.category] || '').trim() : '';
          const matchedCat = PANTRY_CATEGORIES.find((c) => normalizeName(c) === normalizeName(rawCat));
          const category = matchedCat || guessIngredientCategory(name);
          const exists = Boolean(getPantryItemByName(name));

          items.push({ name, amountGrams, category, exists });
        });
        return items;
      }

      // Rezepte- & (Basis)-Vorschau
      const items = [];
      // Erst alle in der CSV selbst definierten "(Basis)"-Einträge erfassen, damit Rezepte in derselben CSV darauf verlinken können
      const pendingBaseNames = new Map();
      dataRows.forEach((row) => {
        const rawTitle = mapping.name >= 0 ? (row[mapping.name] || '').trim() : '';
        if (rawTitle && /\(basis\)/i.test(rawTitle)) {
          const cleanName = rawTitle.replace(/\s*\(basis\)\s*/gi, '').trim();
          pendingBaseNames.set(normalizeName(cleanName), { rawName: rawTitle, cleanName });
        }
      });

      dataRows.forEach((row) => {
        const rawTitle = mapping.name >= 0 ? (row[mapping.name] || '').trim() : '';
        if (!rawTitle) return;

        const isBase = /\(basis\)/i.test(rawTitle);
        const name = isBase ? rawTitle.replace(/\s*\(basis\)\s*/gi, '').trim() : rawTitle;
        const description = mapping.description >= 0 ? (row[mapping.description] || '').trim() : '';
        const rawServings = mapping.defaultServings >= 0 ? parseInt(row[mapping.defaultServings], 10) : 4;
        const defaultServings = rawServings > 0 ? rawServings : 4;
        const rawTime = mapping.prepTimeMinutes >= 0 ? parseInt(row[mapping.prepTimeMinutes], 10) : 25;
        const prepTimeMinutes = rawTime > 0 ? rawTime : 25;

        const ingredients = parseSmartIngredients(mapping.ingredients >= 0 ? row[mapping.ingredients] : '');
        const steps = parseSmartSteps(mapping.steps >= 0 ? row[mapping.steps] : '');

        if (isBase) {
          const computedYield = ingredients.reduce((sum, i) => sum + (Number(i.amountGrams) || 0), 0);
          const yieldGrams = computedYield > 0 ? Math.round(computedYield / 5) * 5 : 400;
          const exists = state.bases.some((b) => normalizeName(b.name) === normalizeName(name));

          items.push({
            isBase: true,
            name,
            description,
            defaultServings,
            prepTimeMinutes,
            yieldGrams,
            baseId: null,
            baseLabel: `Basis (${yieldGrams} g)`,
            baseAmountGrams: 0,
            ingredients,
            steps,
            exists,
          });
          return;
        }

        const baseNameRaw = mapping.baseName >= 0 ? (row[mapping.baseName] || '').trim() : '';
        const baseNameClean = baseNameRaw.replace(/\s*\(basis\)\s*/gi, '').trim();
        const normBaseClean = normalizeName(baseNameClean);

        const matchedBase = baseNameClean
          ? state.bases.find(
              (b) =>
                normalizeName(b.name) === normBaseClean ||
                normalizeName(b.name).includes(normBaseClean) ||
                normBaseClean.includes(normalizeName(b.name))
            )
          : null;
        const matchedPendingBase = !matchedBase && normBaseClean ? pendingBaseNames.get(normBaseClean) : null;

        const rawBaseGrams = mapping.baseAmountGrams >= 0 ? parseFloat(String(row[mapping.baseAmountGrams] || '').replace(',', '.')) : 0;
        const baseAmountGrams =
          matchedBase || matchedPendingBase
            ? rawBaseGrams > 0
              ? cleanGrams(rawBaseGrams)
              : matchedBase
              ? matchedBase.yieldGrams || 400
              : 400
            : 0;

        const exists = state.recipes.some((r) => normalizeName(r.name) === normalizeName(name));

        items.push({
          isBase: false,
          name,
          description,
          defaultServings,
          prepTimeMinutes,
          baseId: matchedBase ? matchedBase.id : null,
          pendingBaseName: matchedPendingBase ? matchedPendingBase.cleanName : null,
          baseLabel: matchedBase
            ? matchedBase.name
            : matchedPendingBase
            ? `${matchedPendingBase.cleanName} (aus CSV)`
            : baseNameClean
            ? `${baseNameClean} (nicht gefunden)`
            : '',
          baseAmountGrams,
          ingredients,
          steps,
          exists,
        });
      });

      return items;
    }

    /** Liest eine hochgeladene Datei (.csv, .txt, .json) mit automatischer UTF-8 / Windows-1252-Erkennung ein */
    function handleUploadedFile(file) {
      if (!file || !state.modal || state.modal.type !== 'import') return;
      const reader = new FileReader();

      reader.onload = (ev) => {
        const buffer = ev.target.result;
        let content = '';
        let detectedEncoding = 'UTF-8';

        // Zuerst strenges UTF-8 versuchen; bei Excel/Windows-1252-CSVs automatisch auf windows-1252 wechseln
        try {
          content = new TextDecoder('utf-8', { fatal: true }).decode(buffer);
        } catch (_utf8Err) {
          content = new TextDecoder('windows-1252').decode(buffer);
          detectedEncoding = 'Windows-1252 (Excel)';
        }

        const fileName = file.name || 'datei';
        const isJson = fileName.toLowerCase().endsWith('.json') || content.trim().startsWith('{');

        if (isJson) {
          try {
            const parsed = JSON.parse(content);
            if (!parsed || typeof parsed !== 'object') throw new Error('Ungültiges JSON');
            state.modal.data = {
              ...state.modal.data,
              fileName,
              detectedEncoding,
              fileKind: 'json',
              jsonPayload: parsed,
              jsonMode: 'merge',
              error: null,
            };
            renderModal();
            return;
          } catch (err) {
            state.modal.data.error = 'Die JSON-Datei konnte nicht gelesen werden. Bitte prüfe das Format.';
            renderModal();
            return;
          }
        }

        // CSV / TXT verarbeiten
        const delimiter = detectCSVDelimiter(content);
        const { headers, dataRows } = parseCSVText(content, delimiter);
        if (headers.length === 0 || dataRows.length === 0) {
          state.modal.data.error = 'Die Datei enthält keine verwertbaren Zeilen. Bitte prüfe die Datei.';
          renderModal();
          return;
        }

        const mapping = autoMapColumns(headers, state.modal.data.targetType);
        state.modal.data = {
          ...state.modal.data,
          fileName,
          detectedEncoding,
          fileKind: 'csv',
          rawText: content,
          delimiter,
          headers,
          dataRows,
          mapping,
          error: null,
        };
        renderModal();
      };

      reader.onerror = () => {
        if (state.modal && state.modal.type === 'import') {
          state.modal.data.error = 'Fehler beim Einlesen der Datei.';
          renderModal();
        }
      };

      reader.readAsArrayBuffer(file);
    }

    /** Führt den endgültigen Import (CSV oder JSON) aus und speichert in State & Cloud */
    async function executeImport() {
      if (!state.modal || state.modal.type !== 'import') return;
      const d = state.modal.data;

      // JSON-Backup Import
      if (d.fileKind === 'json' && d.jsonPayload) {
        const p = d.jsonPayload;
        const replace = d.jsonMode === 'replace';
        const importedBases = Array.isArray(p.bases) ? p.bases : [];
        const importedRecipes = Array.isArray(p.recipes) ? p.recipes : [];
        const importedPantry = Array.isArray(p.pantry) ? p.pantry : [];
        const importedPlan = Array.isArray(p.mealPlan) ? p.mealPlan : [];

        const mergeByName = (current, incoming, prefix) => {
          if (replace) return incoming.map((item) => ({ ...item, id: item.id || generateId(prefix) }));
          const next = [...current];
          incoming.forEach((item) => {
            const idx = next.findIndex((x) => normalizeName(x.name) === normalizeName(item.name));
            if (idx >= 0) next[idx] = { ...next[idx], ...item, id: next[idx].id };
            else next.push({ ...item, id: item.id || generateId(prefix) });
          });
          return next;
        };

        state.bases = mergeByName(state.bases, importedBases, 'base');
        state.recipes = mergeByName(state.recipes, importedRecipes, 'rec');
        state.pantry = mergeByName(state.pantry, importedPantry, 'pan');
        if (replace || state.mealPlan.length === 0) {
          state.mealPlan = importedPlan.map((m) => ({ ...m, id: m.id || generateId('mp') }));
        }

        closeModal();
        renderApp();

        await Promise.all([
          ...state.bases.map((b) => persistDoc('bases', b.id, b)),
          ...state.recipes.map((r) => persistDoc('recipes', r.id, r)),
          ...state.pantry.map((item) => persistDoc('pantry', item.id, item)),
          ...state.mealPlan.map((m) => persistDoc('mealPlan', m.id, m)),
        ]);

        showToast(`JSON-Backup erfolgreich importiert (${importedRecipes.length} Rezepte, ${importedPantry.length} Vorräte).`, 'success');
        return;
      }

      // CSV Import
      const preview = buildImportPreview(d);
      if (preview.length === 0) {
        showToast('Keine gültigen Einträge zum Importieren gefunden.', 'warn');
        return;
      }

      const updateDuplicates = d.duplicateMode === 'update';
      let addedCount = 0;
      let updatedCount = 0;

      if (d.targetType === 'pantry') {
        const docsToSave = [];
        const nextPantry = [...state.pantry];
        preview.forEach((item) => {
          const existingIdx = nextPantry.findIndex((p) => normalizeName(p.name) === normalizeName(item.name));
          if (existingIdx >= 0 && updateDuplicates) {
            const updated = {
              ...nextPantry[existingIdx],
              category: item.category,
              amountGrams: cleanGrams(item.amountGrams),
            };
            nextPantry[existingIdx] = updated;
            docsToSave.push(updated);
            updatedCount++;
          } else {
            const created = {
              id: generateId('pan'),
              name: item.name,
              category: item.category,
              amountGrams: cleanGrams(item.amountGrams),
            };
            nextPantry.push(created);
            docsToSave.push(created);
            addedCount++;
          }
        });

        state.pantry = nextPantry;
        closeModal();
        renderApp();
        await Promise.all(docsToSave.map((docItem) => persistDoc('pantry', docItem.id, docItem)));
        showToast(`Vorrat importiert: ${addedCount} neu, ${updatedCount} aktualisiert.`, 'success');
        return;
      }

      // Rezepte & erkannte "(Basis)"-Einträge importieren
      const nextBases = [...state.bases];
      const nextRecipes = [...state.recipes];
      const baseDocsToSave = [];
      const recipeDocsToSave = [];
      let addedBases = 0;
      let updatedBases = 0;

      // Schritt 1: Alle als "(Basis)" erkannten Zeilen zuerst in die Basen-Datenbank importieren
      const importedBaseIdByNorm = new Map();
      preview
        .filter((item) => item.isBase)
        .forEach((item) => {
          const normName = normalizeName(item.name);
          const existingIdx = nextBases.findIndex((b) => normalizeName(b.name) === normName);
          const payload = {
            name: item.name,
            description: item.description,
            yieldGrams: item.yieldGrams || 400,
            defaultServings: item.defaultServings || 3,
            prepTimeMinutes: item.prepTimeMinutes || 20,
            ingredients: item.ingredients,
            steps: item.steps,
          };

          if (existingIdx >= 0 && updateDuplicates) {
            const updated = { ...nextBases[existingIdx], ...payload };
            nextBases[existingIdx] = updated;
            baseDocsToSave.push(updated);
            importedBaseIdByNorm.set(normName, updated.id);
            updatedBases++;
          } else {
            const created = { id: generateId('basis'), ...payload };
            nextBases.push(created);
            baseDocsToSave.push(created);
            importedBaseIdByNorm.set(normName, created.id);
            addedBases++;
          }
        });

      // Schritt 2: Rezepte importieren und automatisch mit vorhandenen oder gerade importierten Basen verknüpfen
      preview
        .filter((item) => !item.isBase)
        .forEach((item) => {
          let resolvedBaseId = item.baseId;
          if (!resolvedBaseId && item.pendingBaseName) {
            resolvedBaseId = importedBaseIdByNorm.get(normalizeName(item.pendingBaseName)) || null;
          }
          const resolvedBase = resolvedBaseId ? nextBases.find((b) => b.id === resolvedBaseId) : null;
          const existingIdx = nextRecipes.findIndex((r) => normalizeName(r.name) === normalizeName(item.name));
          const payload = {
            name: item.name,
            description: item.description,
            defaultServings: item.defaultServings,
            prepTimeMinutes: item.prepTimeMinutes,
            baseId: resolvedBaseId,
            baseAmountGrams: resolvedBaseId ? item.baseAmountGrams || (resolvedBase ? resolvedBase.yieldGrams : 400) : 0,
            ingredients: item.ingredients,
            steps: item.steps,
          };

          if (existingIdx >= 0 && updateDuplicates) {
            const updated = { ...nextRecipes[existingIdx], ...payload };
            nextRecipes[existingIdx] = updated;
            recipeDocsToSave.push(updated);
            updatedCount++;
          } else {
            const created = { id: generateId('rec'), ...payload };
            nextRecipes.push(created);
            recipeDocsToSave.push(created);
            addedCount++;
          }
        });

      state.bases = nextBases;
      state.recipes = nextRecipes;
      closeModal();
      renderApp();
      await Promise.all([
        ...baseDocsToSave.map((docItem) => persistDoc('bases', docItem.id, docItem)),
        ...recipeDocsToSave.map((docItem) => persistDoc('recipes', docItem.id, docItem)),
      ]);
      const baseSummary = addedBases + updatedBases > 0 ? ` & ${addedBases + updatedBases} Basen` : '';
      showToast(`Import abgeschlossen: ${addedCount} neue Rezepte, ${updatedCount} aktualisiert${baseSummary}!`, 'success');
    }

                <div class="flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <h3 class="text-sm font-bold text-charcoal-900">Spalten-Zuordnung (Mapping)</h3>
                    <p class="text-xs text-charcoal-500">${m.dataRows.length} Datenzeilen erkannt · passe die Spalten bei Bedarf an.</p>
                  </div>
                  <div class="flex items-center gap-2">
                    <label class="text-xs font-semibold text-charcoal-600">Trennzeichen:</label>
                    <select id="import-delimiter-select"
                      class="rounded-xl border border-cream-300 bg-cream-50 px-2.5 py-1.5 text-xs font-medium text-charcoal-800 focus:outline-none focus:border-sage-500">
                      <option value=";" ${m.delimiter === ';' ? 'selected' : ''}>Semikolon (;)</option>
                      <option value="," ${m.delimiter === ',' ? 'selected' : ''}>Komma (,)</option>
                      <option value="\t" ${m.delimiter === '\t' ? 'selected' : ''}>Tabulator</option>
                    </select>
                  </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                  ${fields
                    .map(
                      (f) => `
                    <div>
                      <label class="block text-[11px] font-semibold text-charcoal-700 mb-1">${escapeHtml(f.label)}</label>
                      <select data-map-field="${f.key}"
                        class="w-full rounded-xl border border-cream-300 bg-cream-50 px-2.5 py-1.5 text-xs text-charcoal-800 focus:outline-none focus:border-sage-500">
                        <option value="-1">— nicht zuordnen —</option>
                        ${m.headers
                          .map(
                            (h, idx) => `<option value="${idx}" ${m.mapping[f.key] === idx ? 'selected' : ''}>${escapeHtml(h)}</option>`
                          )
                          .join('')}
                      </select>
                    </div>
                  `
                    )
                    .join('')}
                </div>
              </section>

              <!-- Import-Modus -->
              <div class="bg-white rounded-2xl border border-cream-300 p-3.5 flex flex-wrap items-center justify-between gap-3">
                <span class="text-xs font-bold text-charcoal-800">Umgang mit bestehenden Namen:</span>
                <div class="flex flex-wrap items-center gap-2">
                  <button type="button" data-action="set-duplicate-mode" data-mode="add"
                    class="px-3 py-1.5 rounded-xl text-xs font-semibold border transition-colors ${
                      m.duplicateMode !== 'update'
                        ? 'bg-sage-600 text-white border-sage-600'
                        : 'bg-cream-50 text-charcoal-700 border-cream-300 hover:bg-cream-100'
                    }">
                    Zu bestehenden hinzufügen
                  </button>
                  <button type="button" data-action="set-duplicate-mode" data-mode="update"
                    class="px-3 py-1.5 rounded-xl text-xs font-semibold border transition-colors ${
                      m.duplicateMode === 'update'
                        ? 'bg-sage-600 text-white border-sage-600'
                        : 'bg-cream-50 text-charcoal-700 border-cream-300 hover:bg-cream-100'
                    }">
                    Duplikate nach Namen aktualisieren
                  </button>
                </div>
              </div>

              <!-- Live-Vorschau-Tabelle -->
              <section class="bg-white rounded-3xl border border-cream-300 overflow-hidden">
                <div class="px-4 py-3 bg-sage-50/70 border-b border-sage-100 flex items-center justify-between">
                  <h3 class="text-xs font-bold text-charcoal-900">
                    Live-Vorschau (${preview.length} ${targetType === 'pantry' ? 'Artikel' : 'Rezepte'} erkannt)
                  </h3>
                  ${
                    preview.length > previewSlice.length
                      ? `<span class="text-[11px] text-charcoal-500">Zeige erste ${previewSlice.length} von ${preview.length}</span>`
                      : ''
                  }
                </div>

                ${
                  preview.length === 0
                    ? `<p class="p-5 text-center text-xs text-charcoal-500">Bitte ordne mindestens die Pflichtspalte zu, um die Vorschau zu sehen.</p>`
                    : `
                  <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-xs">
                      <thead>
                        <tr class="bg-cream-50 text-charcoal-500 border-b border-cream-200">
                          ${
                            targetType === 'pantry'
                              ? `<th class="py-2.5 px-3 font-semibold">Zutat</th><th class="py-2.5 px-3 font-semibold">Kategorie</th><th class="py-2.5 px-3 font-semibold">Menge</th><th class="py-2.5 px-3 font-semibold">Status</th>`
                              : `<th class="py-2.5 px-3 font-semibold">Rezept</th><th class="py-2.5 px-3 font-semibold">Port.</th><th class="py-2.5 px-3 font-semibold">Basis</th><th class="py-2.5 px-3 font-semibold">Zutaten</th><th class="py-2.5 px-3 font-semibold">Schritte</th><th class="py-2.5 px-3 font-semibold">Status</th>`
                          }
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-cream-100">
                        ${previewSlice
                          .map((item) =>
                            targetType === 'pantry'
                              ? `
                            <tr class="hover:bg-cream-50/70">
                              <td class="py-2 px-3 font-semibold text-charcoal-900">${escapeHtml(item.name)}</td>
                              <td class="py-2 px-3 text-charcoal-600">${escapeHtml(item.category)}</td>
                              <td class="py-2 px-3">${formatAmountHTML(item.amountGrams, item.name)}</td>
                              <td class="py-2 px-3">
                                <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold ${
                                  item.exists ? 'bg-amber-100 text-amber-800' : 'bg-sage-100 text-sage-800'
                                }">${item.exists ? (m.duplicateMode === 'update' ? 'Aktualisiert' : 'Zusätzlich') : 'Neu'}</span>
                              </td>
                            </tr>
                          `
                              : `
                            <tr class="hover:bg-cream-50/70">
                              <td class="py-2 px-3 font-semibold text-charcoal-900">
                                <div class="flex items-center gap-1.5">
                                  ${
                                    item.isBase
                                      ? `<span class="px-1.5 py-0.5 rounded-md text-[10px] font-bold bg-sage-600 text-white shrink-0">BASIS</span>`
                                      : ''
                                  }
                                  <span>${escapeHtml(item.name)}</span>
                                </div>
                              </td>
                              <td class="py-2 px-3 text-charcoal-600">${item.defaultServings}</td>
                              <td class="py-2 px-3">
                                ${
                                  item.isBase
                                    ? `<span class="px-2 py-0.5 rounded-lg bg-sage-50 text-sage-800 font-medium">Ertrag ca. ${item.yieldGrams} g</span>`
                                    : item.baseId || item.pendingBaseName
                                    ? `<span class="px-2 py-0.5 rounded-lg bg-sage-100 text-sage-800 font-medium">${escapeHtml(item.baseLabel)} (${item.baseAmountGrams} g)</span>`
                                    : item.baseLabel
                                    ? `<span class="text-amber-700">${escapeHtml(item.baseLabel)}</span>`
                                    : `<span class="text-charcoal-400">—</span>`
                                }
                              </td>
                              <td class="py-2 px-3 text-charcoal-700 font-medium">${item.ingredients.length} erkannt</td>
                              <td class="py-2 px-3 text-charcoal-700">${item.steps.length}</td>
                              <td class="py-2 px-3">
                                <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold ${
                                  item.exists ? 'bg-amber-100 text-amber-800' : 'bg-sage-100 text-sage-800'
                                }">${item.exists ? (m.duplicateMode === 'update' ? 'Aktualisiert' : 'Zusätzlich') : 'Neu'}</span>
                              </td>
                            </tr>
                          `
                          )
                          .join('')}
                      </tbody>
                    </table>
                  </div>
                `
                }
              </section>
            `
                : m.fileKind === 'json' && m.jsonPayload
                ? `
              <!-- JSON-Backup Vorschau -->
              <section class="bg-white rounded-3xl border border-sage-200 p-5 space-y-4">
                <div>
                  <h3 class="text-sm font-bold text-charcoal-900">JSON-Backup erkannt</h3>
                  <p class="text-xs text-charcoal-500 mt-0.5">Enthaltene Datensätze in deiner Backup-Datei:</p>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 text-center">
                  <div class="bg-cream-50 rounded-2xl p-3 border border-cream-200">
                    <div class="text-lg font-bold text-sage-700">${(m.jsonPayload.recipes || []).length}</div>
                    <div class="text-[11px] text-charcoal-500">Rezepte</div>
                  </div>
                  <div class="bg-cream-50 rounded-2xl p-3 border border-cream-200">
                    <div class="text-lg font-bold text-sage-700">${(m.jsonPayload.bases || []).length}</div>
                    <div class="text-[11px] text-charcoal-500">Basen</div>
                  </div>
                  <div class="bg-cream-50 rounded-2xl p-3 border border-cream-200">
                    <div class="text-lg font-bold text-sage-700">${(m.jsonPayload.pantry || []).length}</div>
                    <div class="text-[11px] text-charcoal-500">Vorräte</div>
                  </div>
                  <div class="bg-cream-50 rounded-2xl p-3 border border-cream-200">
                    <div class="text-lg font-bold text-sage-700">${(m.jsonPayload.mealPlan || []).length}</div>
                    <div class="text-[11px] text-charcoal-500">Wochenplan</div>
                  </div>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                  <button type="button" data-action="set-json-mode" data-mode="merge"
                    class="px-3 py-1.5 rounded-xl text-xs font-semibold border ${
                      m.jsonMode !== 'replace' ? 'bg-sage-600 text-white border-sage-600' : 'bg-cream-50 text-charcoal-700 border-cream-300'
                    }">Mit bestehenden Daten zusammenführen</button>
                  <button type="button" data-action="set-json-mode" data-mode="replace"
                    class="px-3 py-1.5 rounded-xl text-xs font-semibold border ${
                      m.jsonMode === 'replace' ? 'bg-terracotta-500 text-white border-terracotta-500' : 'bg-cream-50 text-charcoal-700 border-cream-300'
                    }">Bestehende Daten komplett ersetzen</button>
                </div>
              </section>
            `
                : `
              <!-- Hilfe-Hinweis vor dem Upload -->
              <div class="bg-white rounded-2xl border border-cream-200 p-4 text-xs text-charcoal-600 space-y-1.5">
                <p class="font-bold text-charcoal-800">Unterstützte Zutaten-Formate in deiner CSV:</p>
                <p>• Strukturiert: <code class="bg-cream-100 px-1.5 py-0.5 rounded">Hackfleisch:500:g | Zwiebeln:150:g</code></p>
                <p>• Natürlich: <code class="bg-cream-100 px-1.5 py-0.5 rounded">500 g Hackfleisch; 2 EL Olivenöl; 1 TL Salz</code> oder mehrzeilig in einer Zelle</p>
              </div>
            `
            }
          </div>

          <!-- Footer -->
          <div class="px-5 sm:px-6 py-3.5 bg-white border-t border-cream-200 flex items-center justify-between gap-3">
            <button type="button" data-action="close-modal"
              class="px-4 py-2 rounded-xl text-xs sm:text-sm font-medium text-charcoal-600 hover:bg-cream-100">
              Abbrechen
            </button>
            <button type="button" data-action="execute-import"
              ${(m.fileKind === 'csv' && preview.length > 0) || m.fileKind === 'json' ? '' : 'disabled'}
              class="px-5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all ${
                (m.fileKind === 'csv' && preview.length > 0) || m.fileKind === 'json'
                  ? 'bg-sage-600 hover:bg-sage-700 text-white shadow-sm'
                  : 'bg-cream-200 text-charcoal-400 cursor-not-allowed'
              }">
              ${
                m.fileKind === 'json'
                  ? 'JSON-Backup jetzt importieren'
                  : `${preview.length} ${targetType === 'pantry' ? 'Artikel' : 'Rezepte'} jetzt importieren`
              }
            </button>
          </div>
        </div>
      `;
    }

    function renderModal() {
      const root = document.getElementById('modal-root');
      if (!root) return;
      if (!state.modal) {
        root.classList.add('hidden');
        root.innerHTML = '';
        return;
      }

      let content = '';
      switch (state.modal.type) {
        case 'cook':
          content = renderCookModalContent(state.modal.data);
          break;
        case 'batchPrep':
          content = renderBatchPrepModalContent(state.modal.data);
          break;
        case 'addMeal':
          content = renderAddMealModalContent(state.modal.data);
          break;
        case 'pantry':
          content = renderPantryModalContent(state.modal.data);
          break;
        case 'recipe':
          content = renderRecipeModalContent(state.modal.data);
          break;
        case 'base':
          content = renderBaseModalContent(state.modal.data);
          break;
        case 'confirm':
          content = renderConfirmModalContent(state.modal.data);
          break;
        case 'storageInfo':
          content = renderStorageInfoModalContent();
          break;
        case 'import':
          content = renderImportModalContent(state.modal.data);
          break;
      }

      root.classList.remove('hidden');
      root.innerHTML = `
        <div id="modal-backdrop" class="fixed inset-0 bg-charcoal-900/50 backdrop-blur-xs flex items-center justify-center p-3 sm:p-5">
          ${content}
        </div>
      `;
    }

    // =========================================================================
    // 14. HAUPT-RENDERING & EVENT-DELEGATION
    // =========================================================================

    function renderApp() {
      if (!state.initialized) return;
      renderNavigation();

      const main = document.getElementById('app-main');
      if (!main) return;

      // Aktiven Input-Fokus merken (für flüssiges Tippen in Suchfeldern)
      const activeEl = document.activeElement;
      const activeId = activeEl && (activeEl.id === 'pantry-search-input' || activeEl.id === 'recipe-search-input') ? activeEl.id : null;
      const selStart = activeId ? activeEl.selectionStart : null;

      if (state.activeTab === 'week') {
        main.innerHTML = renderWeekView();
      } else if (state.activeTab === 'shopping') {
        main.innerHTML = renderShoppingView();
      } else if (state.activeTab === 'pantry') {
        main.innerHTML = renderPantryView();
      } else if (state.activeTab === 'recipes') {
        main.innerHTML = renderRecipesView();
      }

      if (activeId) {
        const restored = document.getElementById(activeId);
        if (restored) {
          restored.focus();
          if (selStart !== null) restored.setSelectionRange(selStart, selStart);
        }
      }

      if (state.modal) {
        renderModal();
      }
    }

    // Globale Click-Delegation
    document.addEventListener('click', (e) => {
      const target = e.target;

      // Klick auf Modal-Backdrop schließt das Modal
      if (target.id === 'modal-backdrop') {
        closeModal();
        return;
      }

      // Navigations-Tabs
      const navBtn = target.closest('[data-nav-tab]');
      if (navBtn) {
        state.activeTab = navBtn.dataset.navTab;
        renderApp();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      // Header-Buttons
      if (target.closest('#global-unit-toggle')) {
        state.showSpoons = !state.showSpoons;
        renderApp();
        persistSettings();
        return;
      }

      if (target.closest('#reset-demo-btn')) {
        openModal('storageInfo');
        return;
      }

      // Kochmodus-spezifische Aktionen
      const cookServBtn = target.closest('[data-cook-servings]');
      if (cookServBtn && state.modal && state.modal.type === 'cook') {
        state.modal.data.servings = Math.max(1, parseInt(cookServBtn.dataset.cookServings, 10) || 4);
        renderModal();
        return;
      }

      const cookToggleBtn = target.closest('[data-cook-toggle]');
      if (cookToggleBtn && state.modal && state.modal.type === 'cook') {
        const kind = cookToggleBtn.dataset.cookToggle;
        if (kind === 'base-ings') {
          state.modal.data.baseIngredientsCollapsed = !state.modal.data.baseIngredientsCollapsed;
        } else if (kind === 'base-steps') {
          state.modal.data.baseStepsCollapsed = !state.modal.data.baseStepsCollapsed;
        } else if (kind === 'all-base') {
          const allClosed = state.modal.data.baseIngredientsCollapsed && state.modal.data.baseStepsCollapsed;
          state.modal.data.baseIngredientsCollapsed = !allClosed;
          state.modal.data.baseStepsCollapsed = !allClosed;
        }
        renderModal();
        return;
      }

      const cookCheckBtn = target.closest('[data-cook-check]');
      if (cookCheckBtn && state.modal && state.modal.type === 'cook') {
        const kind = cookCheckBtn.dataset.cookCheck;
        const idx = cookCheckBtn.dataset.idx;
        const mapKey = {
          'base-ing': 'checkedBaseIngs',
          'main-ing': 'checkedMainIngs',
          'base-step': 'checkedBaseSteps',
          'main-step': 'checkedMainSteps',
        }[kind];
        if (mapKey) {
          state.modal.data[mapKey][idx] = !state.modal.data[mapKey][idx];
          renderModal();
        }
        return;
      }

      // Allgemeine Daten-Aktionen
      const actionBtn = target.closest('[data-action]');
      if (!actionBtn) return;

      const action = actionBtn.dataset.action;

      switch (action) {
        case 'close-modal':
          closeModal();
          break;

        case 'toggle-global-units':
          state.showSpoons = !state.showSpoons;
          renderApp();
          persistSettings();
          break;

        case 'open-cook':
          openCookModal(actionBtn.dataset.recipeId, actionBtn.dataset.servings);
          break;

        case 'open-batch-prep':
          openModal('batchPrep', {
            baseId: actionBtn.dataset.baseId,
            totalGrams: Number(actionBtn.dataset.totalGrams) || 400,
          });
          break;

        case 'open-add-meal':
          openModal('addMeal', {
            day: actionBtn.dataset.day || 'Montag',
            recipeId: actionBtn.dataset.recipeId || '',
          });
          break;

        case 'remove-meal':
          removeMealFromPlan(actionBtn.dataset.mealId);
          break;

        case 'toggle-prepped':
          togglePreppedBase(actionBtn.dataset.baseId);
          break;

        case 'set-suggestion-sort':
          state.suggestionSort = actionBtn.dataset.sort;
          renderApp();
          break;

        case 'toggle-mobile-suggestions':
          state.mobileSuggestionsOpen = !state.mobileSuggestionsOpen;
          renderApp();
          break;

        case 'quick-add-suggestion': {
          const recId = actionBtn.dataset.recipeId;
          const select = document.querySelector(`[data-suggestion-day="${recId}"]`);
          const day = select ? select.value : 'Dienstag';
          const rec = getRecipeById(recId);
          addMealToPlan(day, recId, rec ? rec.defaultServings : 4);
          break;
        }

        case 'toggle-shop-check':
          toggleShoppingCheck(actionBtn.dataset.norm);
          break;

        case 'toggle-force-buy':
          toggleForceBuy(actionBtn.dataset.norm, actionBtn.dataset.name);
          break;

        case 'book-checked':
          bookCheckedToPantry();
          break;

        case 'set-pantry-cat':
          state.pantryCategory = actionBtn.dataset.cat;
          renderApp();
          break;

        case 'adjust-pantry':
          adjustPantryAmount(actionBtn.dataset.id, Number(actionBtn.dataset.delta));
          break;

        case 'open-pantry-modal':
          openModal('pantry', { id: actionBtn.dataset.id || null });
          break;

        case 'confirm-delete-pantry': {
          const item = state.pantry.find((p) => p.id === actionBtn.dataset.id);
          if (!item) break;
          openModal('confirm', {
            title: 'Zutat aus Vorrat löschen?',
            message: `Möchtest du „${item.name}“ (${formatNumberDE(item.amountGrams, 0)} g) wirklich aus deiner Vorrats-Datenbank entfernen?`,
            confirmLabel: 'Löschen',
            danger: true,
            onConfirm: () => deletePantryItem(item.id),
          });
          break;
        }

        case 'set-recipes-subtab':
          state.recipesSubTab = actionBtn.dataset.subtab;
          renderApp();
          break;

        case 'set-recipe-base-filter':
          state.recipeBaseFilter = actionBtn.dataset.filter;
          renderApp();
          break;

        case 'open-recipe-modal':
          openModal('recipe', { id: actionBtn.dataset.id || null });
          break;

        case 'confirm-delete-recipe': {
          const rec = getRecipeById(actionBtn.dataset.id);
          if (!rec) break;
          openModal('confirm', {
            title: 'Rezept löschen?',
            message: `Soll „${rec.name}“ dauerhaft gelöscht werden? Eventuelle Einträge im Wochenplan werden ebenfalls entfernt.`,
            confirmLabel: 'Löschen',
            danger: true,
            onConfirm: () => deleteRecipe(rec.id),
          });
          break;
        }

        case 'open-base-modal':
          openModal('base', { id: actionBtn.dataset.id || null });
          break;

        case 'confirm-delete-base': {
          const base = getBaseById(actionBtn.dataset.id);
          if (!base) break;
          openModal('confirm', {
            title: 'Rezept-Basis löschen?',
            message: `Soll „${base.name}“ gelöscht werden? Verknüpfte Rezepte bleiben erhalten, verlieren aber die Basis-Zuordnung.`,
            confirmLabel: 'Löschen',
            danger: true,
            onConfirm: () => deleteBase(base.id),
          });
          break;
        }

        case 'confirm-reset-demo':
          openModal('confirm', {
            title: 'Beispieldaten zurücksetzen?',
            message: 'Alle aktuellen Vorräte, Rezepte, Basen und dein Wochenplan werden auf den realistischen Ausgangszustand zurückgesetzt.',
            confirmLabel: 'Zurücksetzen',
            danger: true,
            onConfirm: async () => {
              closeModal();
              await resetToSampleData();
            },
          });
          break;

        case 'execute-confirm':
          if (state.modal && state.modal.type === 'confirm' && typeof state.modal.data.onConfirm === 'function') {
            state.modal.data.onConfirm();
          }
          break;

        case 'add-ing-row': {
          const container = document.getElementById('form-ingredients-container');
          if (container) {
            container.insertAdjacentHTML('beforeend', createIngredientRowHTML());
          }
          break;
        }

        case 'add-step-row': {
          const container = document.getElementById('form-steps-container');
          if (container) {
            container.insertAdjacentHTML('beforeend', createStepRowHTML());
          }
          break;
        }

        case 'remove-form-row': {
          const row = actionBtn.closest('.ing-row, .step-row');
          if (row && row.parentElement && row.parentElement.children.length > 1) {
            row.remove();
          }
          break;
        }

        case 'open-import-modal':
          openModal('import', {
            targetType: actionBtn.dataset.importTarget || 'recipes',
            fileName: '',
            fileKind: null,
            rawText: '',
            delimiter: ';',
            headers: [],
            dataRows: [],
            mapping: {},
            duplicateMode: 'add',
            jsonPayload: null,
            jsonMode: 'merge',
            error: null,
          });
          break;

        case 'set-import-target':
          if (state.modal && state.modal.type === 'import') {
            const nextTarget = actionBtn.dataset.target;
            state.modal.data.targetType = nextTarget;
            if (state.modal.data.fileKind === 'csv' && state.modal.data.headers.length > 0) {
              state.modal.data.mapping = autoMapColumns(state.modal.data.headers, nextTarget);
            }
            renderModal();
          }
          break;

        case 'trigger-file-input': {
          const fileInput = document.getElementById('import-file-input');
          if (fileInput) fileInput.click();
          break;
        }

        case 'set-duplicate-mode':
          if (state.modal && state.modal.type === 'import') {
            state.modal.data.duplicateMode = actionBtn.dataset.mode;
            renderModal();
          }
          break;

        case 'set-json-mode':
          if (state.modal && state.modal.type === 'import') {
            state.modal.data.jsonMode = actionBtn.dataset.mode;
            renderModal();
          }
          break;

        case 'execute-import':
          executeImport();
          break;

        case 'export-recipes-csv':
          exportRecipesCSV();
          break;

        case 'export-pantry-csv':
          exportPantryCSV();
          break;

        case 'download-sample-csv':
          downloadSampleCSV(actionBtn.dataset.sampleType || 'recipes');
          break;

        case 'export-json-backup':
          exportJsonBackup();
          break;
      }
    });

    // Datei-Upload, Trennzeichen-Wechsel & Spalten-Mapping im Import-Modal
    document.addEventListener('change', (e) => {
      if (e.target.id === 'import-file-input') {
        const file = e.target.files && e.target.files[0];
        if (file) handleUploadedFile(file);
        return;
      }

      if (e.target.id === 'import-delimiter-select' && state.modal && state.modal.type === 'import') {
        const delim = e.target.value;
        const { headers, dataRows } = parseCSVText(state.modal.data.rawText, delim);
        state.modal.data.delimiter = delim;
        state.modal.data.headers = headers;
        state.modal.data.dataRows = dataRows;
        state.modal.data.mapping = autoMapColumns(headers, state.modal.data.targetType);
        renderModal();
        return;
      }

      if (e.target.dataset && e.target.dataset.mapField && state.modal && state.modal.type === 'import') {
        state.modal.data.mapping[e.target.dataset.mapField] = parseInt(e.target.value, 10);
        renderModal();
      }
    });

    // Drag & Drop Unterstützung für die Upload-Zone
    document.addEventListener('dragover', (e) => {
      const zone = e.target.closest('#import-drop-zone');
      if (!zone) return;
      e.preventDefault();
      zone.classList.add('border-sage-600', 'bg-sage-50');
    });

    document.addEventListener('dragleave', (e) => {
      const zone = e.target.closest('#import-drop-zone');
      if (!zone) return;
      zone.classList.remove('border-sage-600', 'bg-sage-50');
    });

    document.addEventListener('drop', (e) => {
      const zone = e.target.closest('#import-drop-zone');
      if (!zone) return;
      e.preventDefault();
      zone.classList.remove('border-sage-600', 'bg-sage-50');
      const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) handleUploadedFile(file);
    });

    // Live-Suche in Vorrat & Rezepten
    document.addEventListener('input', (e) => {
      if (e.target.id === 'pantry-search-input') {
        state.pantrySearch = e.target.value;
        renderApp();
      } else if (e.target.id === 'recipe-search-input') {
        state.recipeSearch = e.target.value;
        renderApp();
      }
    });

    // Formular-Submissions (Modals)
    document.addEventListener('submit', (e) => {
      const form = e.target;

      if (form.id === 'add-meal-form') {
        e.preventDefault();
        const fd = new FormData(form);
        closeModal();
        addMealToPlan(fd.get('day'), fd.get('recipeId'), fd.get('servings'));
        return;
      }

      if (form.id === 'pantry-form') {
        e.preventDefault();
        const fd = new FormData(form);
        savePantryItem({
          id: fd.get('id') || null,
          name: fd.get('name'),
          category: fd.get('category'),
          amountGrams: fd.get('amountGrams'),
        });
        return;
      }

      if (form.id === 'recipe-form') {
        e.preventDefault();
        const fd = new FormData(form);
        const ingredients = Array.from(form.querySelectorAll('.ing-row')).map((row) => ({
          name: row.querySelector('[data-field="name"]').value,
          amountGrams: row.querySelector('[data-field="amountGrams"]').value,
          category: row.querySelector('[data-field="category"]').value,
        }));
        const steps = Array.from(form.querySelectorAll('.step-row')).map(
          (row) => row.querySelector('[data-field="step"]').value
        );

        saveRecipe({
          id: fd.get('id') || null,
          name: fd.get('name'),
          description: fd.get('description'),
          defaultServings: fd.get('defaultServings'),
          prepTimeMinutes: fd.get('prepTimeMinutes'),
          baseId: fd.get('baseId') || null,
          baseAmountGrams: fd.get('baseAmountGrams'),
          ingredients,
          steps,
        });
        return;
      }

      if (form.id === 'base-form') {
        e.preventDefault();
        const fd = new FormData(form);
        const ingredients = Array.from(form.querySelectorAll('.ing-row')).map((row) => ({
          name: row.querySelector('[data-field="name"]').value,
          amountGrams: row.querySelector('[data-field="amountGrams"]').value,
          category: row.querySelector('[data-field="category"]').value,
        }));
        const steps = Array.from(form.querySelectorAll('.step-row')).map(
          (row) => row.querySelector('[data-field="step"]').value
        );

        saveBase({
          id: fd.get('id') || null,
          name: fd.get('name'),
          description: fd.get('description'),
          yieldGrams: fd.get('yieldGrams'),
          ingredients,
          steps,
        });
        return;
      }
    });

    // Escape-Taste schließt offene Modals
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && state.modal) {
        closeModal();
      }
    });

    // =========================================================================
    // 15. APP STARTEN
    // =========================================================================
    initAppStorage();
  </script>
</body>
</html>
