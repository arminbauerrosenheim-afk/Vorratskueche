        { id: 'pan-13', name: 'Weizenmehl', category: 'Trockenvorrat', amountGrams: 800 },
        { id: 'pan-14', name: 'Dijon-Senf', category: 'Gewürze & Öle', amountGrams: 150 },
        { id: 'pan-15', name: 'Honig', category: 'Gewürze & Öle', amountGrams: 250 },
        { id: 'pan-16', name: 'Knoblauch', category: 'Frisch & Gemüse', amountGrams: 60 },
      ];

      const mealPlan = [
        { id: 'mp-1', day: 'Montag', recipeId: 'rec-spaghetti-napoli', servings: 4 },
        { id: 'mp-2', day: 'Mittwoch', recipeId: 'rec-chili-con-carne', servings: 4 },
        { id: 'mp-3', day: 'Donnerstag', recipeId: 'rec-linsen-dal', servings: 4 },
        { id: 'mp-4', day: 'Freitag', recipeId: 'rec-baked-beans', servings: 4 },
      ];

      return { bases, recipes, pantry, mealPlan };
    }

    // =========================================================================
    // 3. ANWENDUNGSZUSTAND (STATE) & FIREBASE REFERENZEN
    // =========================================================================

    const state = {
      initialized: false,
      storageMode: 'memory', // 'cloud' oder 'memory'
      activeTab: 'week',     // 'week' | 'shopping' | 'pantry' | 'recipes'
      recipesSubTab: 'recipes', // 'recipes' | 'bases'
      showSpoons: true,

      // Kern-Daten
      pantry: [],
      bases: [],
      recipes: [],
      mealPlan: [],

      // Wochenplan- & Einkaufs-Status
      preppedBases: {},      // { [baseId]: true }
      forceBuy: {},          // { [normalizedName]: true }
      checkedShopping: {},   // { [normalizedName]: true }

      // Filter- & UI-Zustände
      pantrySearch: '',
      pantryCategory: 'Alle',
      recipeSearch: '',
      recipeBaseFilter: 'Alle',
      suggestionSort: 'combo', // 'combo' | 'pantry' | 'synergy'
      mobileSuggestionsOpen: false,

      // Aktives Modal
      modal: null, // { type: 'cook'|'pantry'|'recipe'|'base'|'addMeal'|'batchPrep'|'confirm'|'storageInfo', data: ... }
    };

    // Firebase Instanzen
    let db = null;
    let auth = null;
    let currentUser = null;
    let appId = typeof __app_id !== 'undefined' ? __app_id : 'vorratskueche-default';
    let unsubscribers = [];

    // =========================================================================
    // 4. HILFSFUNKTIONEN (TEXT, ZAHLEN, EINHEITEN-UMRECHNUNG)
    // =========================================================================

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function normalizeName(name) {
      return String(name || '').trim().toLowerCase().replace(/\s+/g, ' ');
    }

    function generateId(prefix = 'id') {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) {
        return `${prefix}-${crypto.randomUUID().slice(0, 8)}`;
      }
      return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`;
    }

    /** Formatiert Zahlen sauber nach deutschem Standard (z. B. 1.200 oder 1,5) */
    function formatNumberDE(num, maxDecimals = 1) {
      const rounded = Math.round(num * Math.pow(10, maxDecimals)) / Math.pow(10, maxDecimals);
      return rounded.toLocaleString('de-DE', {
        minimumFractionDigits: 0,
        maximumFractionDigits: maxDecimals,
      });
    }

    /** Rundet Grammzahlen praxisnah (ganze Gramm ab 10g, 1 Dezimalstelle bei kleinen Mengen) */
    function cleanGrams(grams) {
      if (grams >= 10) return Math.round(grams);
      return Math.round(grams * 10) / 10;
    }

    /**
     * Berechnet eine sinnvolle TL/EL-Angabe für eine Zutat.
     * Gibt null zurück, wenn Löffel für diese Zutat oder Menge keinen Sinn ergeben.
     */
    function getSpoonConversion(grams, ingredientName) {
      if (!grams || grams <= 0 || !ingredientName) return null;
      const norm = normalizeName(ingredientName);
      const entry = SPOON_CONVERSIONS.find((rule) =>
        rule.keywords.some((kw) => norm === kw || norm.includes(kw))
      );
      if (!entry) return null;
      if (grams > entry.maxGrams) return null;

      // Sehr kleine Gewürzmenge (z. B. 1 g Muskatnuss bei 1 TL = 3 g)
      const tlExact = grams / entry.tl;
      if (tlExact < 0.4) {
        if (tlExact >= 0.2) return '⅓ TL';
        return '1 Prise';
      }

      // Entscheide ob EL oder TL sinnvoller ist
      const elExact = grams / entry.el;
      if (elExact >= 0.9) {
        const elRounded = Math.round(elExact * 2) / 2;
        if (elRounded <= 8) {
          return `${formatNumberDE(elRounded, 1)} EL`;
        }
        return null;
      }

      const tlRounded = Math.round(tlExact * 2) / 2;
      if (tlRounded > 0 && tlRounded <= 6) {
        return `${formatNumberDE(tlRounded, 1)} TL`;
      }
      return null;
    }

    /**
     * Rendert eine Menge als HTML: Immer exakt in Gramm, optional mit schönem TL/EL-Badge.
     */
    function formatAmountHTML(grams, ingredientName, showSpoons = state.showSpoons) {
      const g = cleanGrams(grams);
      const gStr = `${formatNumberDE(g, g < 10 ? 1 : 0)} g`;
      if (!showSpoons) return `<span class="font-semibold tabular-nums">${gStr}</span>`;
      const spoon = getSpoonConversion(g, ingredientName);
      if (!spoon) return `<span class="font-semibold tabular-nums">${gStr}</span>`;
      return `<span class="font-semibold tabular-nums">${gStr}</span> <span class="text-xs font-medium text-sage-700 bg-sage-100/90 px-1.5 py-0.5 rounded-md ml-0.5 whitespace-nowrap">(${spoon})</span>`;
    }

    /** Reiner Text für Tooltips / Zusammenfassungen */
    function formatAmountText(grams, ingredientName, showSpoons = state.showSpoons) {
      const g = cleanGrams(grams);
      const gStr = `${formatNumberDE(g, g < 10 ? 1 : 0)} g`;
      if (!showSpoons) return gStr;
      const spoon = getSpoonConversion(g, ingredientName);
      return spoon ? `${gStr} (${spoon})` : gStr;
    }

    function getBaseById(id) {
      return state.bases.find((b) => b.id === id) || null;
    }

    function getRecipeById(id) {
      return state.recipes.find((r) => r.id === id) || null;
    }

    function getPantryItemByName(name) {
      const norm = normalizeName(name);
      return state.pantry.find((p) => normalizeName(p.name) === norm) || null;
    }

    function getPantryGrams(name) {
      const item = getPantryItemByName(name);
      return item ? Number(item.amountGrams) || 0 : 0;
    }

    /** Liefert alle bekannten Zutatennamen (für Autocomplete in Formularen) */
    function getAllKnownIngredientNames() {
      const map = new Map();
      state.pantry.forEach((p) => map.set(normalizeName(p.name), p.name));
      state.bases.forEach((b) => (b.ingredients || []).forEach((i) => map.set(normalizeName(i.name), i.name)));
      state.recipes.forEach((r) => (r.ingredients || []).forEach((i) => map.set(normalizeName(i.name), i.name)));
      return Array.from(map.values()).sort((a, b) => a.localeCompare(b, 'de'));
    }

    // =========================================================================
    // 5. KERN-BERECHNUNGEN (MEAL-PREP-BASEN, VORRAT-MATCH, EINKAUFSLISTE)
    // =========================================================================

    /**
     * Berechnet die benötigten Zutaten eines Rezepts für eine gegebene Portionszahl.
     * Gibt getrennt Hauptzutaten, skalierte Basis-Menge und (falls gewünscht) Basis-Zutaten zurück.
     */
    function getScaledRecipeDetails(recipe, servings = recipe.defaultServings) {
      const factor = (Number(servings) || recipe.defaultServings || 4) / (recipe.defaultServings || 4);
      const base = recipe.baseId ? getBaseById(recipe.baseId) : null;
      const scaledBaseGrams = base ? (Number(recipe.baseAmountGrams) || base.yieldGrams || 400) * factor : 0;
      const baseScaleFactor = base && base.yieldGrams > 0 ? scaledBaseGrams / base.yieldGrams : 0;

      const baseIngredients = base
        ? (base.ingredients || []).map((ing) => ({
            ...ing,
            amountGrams: (Number(ing.amountGrams) || 0) * baseScaleFactor,
          }))
        : [];

      const mainIngredients = (recipe.ingredients || []).map((ing) => ({
        ...ing,
        amountGrams: (Number(ing.amountGrams) || 0) * factor,
      }));

      return {
        factor,
        base,
        scaledBaseGrams,
        baseScaleFactor,
        baseIngredients,
        mainIngredients,
      };
    }

    /**
     * Analysiert alle im Wochenplan genutzten Rezept-Basen für den Meal-Prep-Banner.
     */
    function computeWeeklyBaseAnalysis() {
      const map = new Map(); // baseId -> { base, totalGrams, meals: [{ meal, recipe, baseGrams }], isPrepped }

      state.mealPlan.forEach((meal) => {
        const recipe = getRecipeById(meal.recipeId);
        if (!recipe || !recipe.baseId) return;
        const base = getBaseById(recipe.baseId);
        if (!base) return;

        const details = getScaledRecipeDetails(recipe, meal.servings);
        if (!map.has(base.id)) {
          map.set(base.id, {
            base,
            totalGrams: 0,
            meals: [],
            isPrepped: Boolean(state.preppedBases[base.id]),
          });
        }
        const entry = map.get(base.id);
        entry.totalGrams += details.scaledBaseGrams;
        entry.meals.push({ meal, recipe, baseGrams: details.scaledBaseGrams });
      });

      // Aggregierte Zutaten pro Gesamt-Batch berechnen
      const results = Array.from(map.values()).map((entry) => {
        const batchFactor = entry.base.yieldGrams > 0 ? entry.totalGrams / entry.base.yieldGrams : 1;
        const batchIngredients = (entry.base.ingredients || []).map((ing) => ({
          ...ing,
          amountGrams: (Number(ing.amountGrams) || 0) * batchFactor,
        }));
        return {
          ...entry,
          batchIngredients,
          isShared: entry.meals.length >= 2,
        };
      });

      // Mehrfach geteilte Basen zuerst, dann nach Gesamtmenge absteigend
      results.sort((a, b) => {
        if (a.isShared !== b.isShared) return a.isShared ? -1 : 1;
        return b.totalGrams - a.totalGrams;
      });

      return results;
    }

    /**
     * Berechnet den Vorrats-Match eines Rezepts (inkl. Basis-Zutaten, sofern Basis nicht vorgekocht ist).
     */
    function computeRecipePantryMatch(recipe, servings = recipe.defaultServings) {
      const details = getScaledRecipeDetails(recipe, servings);
      const neededMap = new Map(); // normName -> { name, needed }

      const addIng = (ing) => {
        const norm = normalizeName(ing.name);
        if (!norm) return;
        const prev = neededMap.get(norm) || { name: ing.name, needed: 0 };
        prev.needed += Number(ing.amountGrams) || 0;
        neededMap.set(norm, prev);
      };

      details.mainIngredients.forEach(addIng);
      if (details.base && !state.preppedBases[details.base.id]) {
        details.baseIngredients.forEach(addIng);
      }

      const items = Array.from(neededMap.values());
      if (items.length === 0) {
        return { percent: 100, fullyCovered: 0, total: 0 };
      }

      let scoreSum = 0;
      let fullyCovered = 0;

      items.forEach((item) => {
        const have = getPantryGrams(item.name);
        if (have >= item.needed - 0.01) {
          scoreSum += 1;
          fullyCovered += 1;
        } else if (have > 0 && item.needed > 0) {
          scoreSum += have / item.needed;
        }
      });

      return {
        percent: Math.round((scoreSum / items.length) * 100),
        fullyCovered,
        total: items.length,
      };
    }

    /**
     * Erstellt intelligente Rezept-Vorschläge sortiert nach Vorrat-Match und Meal-Prep-Synergie.
     */
    function computeRecipeSuggestions() {
      // Welche Basen sind bereits im Wochenplan und an welchen Tagen?
      const plannedBaseDays = new Map(); // baseId -> [day, ...]
      const plannedRecipeIds = new Set();

      state.mealPlan.forEach((meal) => {
        plannedRecipeIds.add(meal.recipeId);
        const rec = getRecipeById(meal.recipeId);
        if (rec && rec.baseId) {
          const arr = plannedBaseDays.get(rec.baseId) || [];
          if (!arr.includes(meal.day)) arr.push(meal.day);
          plannedBaseDays.set(rec.baseId, arr);
        }
      });

      const list = state.recipes.map((recipe) => {
        const match = computeRecipePantryMatch(recipe);
        const base = recipe.baseId ? getBaseById(recipe.baseId) : null;
        const synergyDays = recipe.baseId ? plannedBaseDays.get(recipe.baseId) || [] : [];
        const hasSynergy = synergyDays.length > 0;
        const alreadyPlanned = plannedRecipeIds.has(recipe.id);

        // Kombi-Score: Vorrat-Match + 35 Punkte Bonus für Meal-Prep-Synergie, leichte Abwertung wenn bereits diese Woche eingeplant
        const comboScore = match.percent + (hasSynergy ? 35 : 0) - (alreadyPlanned ? 20 : 0);

        return {
          recipe,
          base,
          match,
          synergyDays,
          hasSynergy,
          alreadyPlanned,
          comboScore,
        };
      });

      list.sort((a, b) => {
        if (state.suggestionSort === 'pantry') {
          return b.match.percent - a.match.percent || (b.hasSynergy ? 1 : 0) - (a.hasSynergy ? 1 : 0);
        }
        if (state.suggestionSort === 'synergy') {
          if (a.hasSynergy !== b.hasSynergy) return a.hasSynergy ? -1 : 1;
          return b.match.percent - a.match.percent;
        }
        return b.comboScore - a.comboScore;
      });

      return list;
    }

    /**
     * Generiert die Einkaufsliste live aus dem Wochenplan inkl. exaktem Abgleich mit dem Vorrat.
     */
    function computeShoppingList() {
      const aggregated = new Map(); // normName -> { normName, name, category, neededGrams, sources: Set<string> }
      const skippedPreppedBases = new Map(); // baseId -> base

      const addIngredient = (ing, sourceLabel) => {
        const norm = normalizeName(ing.name);
        if (!norm) return;
        if (!aggregated.has(norm)) {
          const pantryRef = getPantryItemByName(ing.name);
          aggregated.set(norm, {
            normName: norm,
            name: pantryRef ? pantryRef.name : ing.name.trim(),
            category: ing.category || (pantryRef ? pantryRef.category : 'Trockenvorrat'),
            neededGrams: 0,
            sources: new Set(),
          });
        }
        const entry = aggregated.get(norm);
        entry.neededGrams += Number(ing.amountGrams) || 0;
        if (sourceLabel) entry.sources.add(sourceLabel);
      };

      state.mealPlan.forEach((meal) => {
        const recipe = getRecipeById(meal.recipeId);
        if (!recipe) return;
        const details = getScaledRecipeDetails(recipe, meal.servings);

        details.mainIngredients.forEach((ing) => addIngredient(ing, recipe.name));

        if (details.base) {
          if (state.preppedBases[details.base.id]) {
            skippedPreppedBases.set(details.base.id, details.base);
          } else {
            details.baseIngredients.forEach((ing) => addIngredient(ing, `${details.base.name} (${recipe.name})`));
          }
        }
      });

      const toBuy = [];
      const fromPantry = [];

      aggregated.forEach((entry) => {
        const pantryGrams = getPantryGrams(entry.name);
        const needed = cleanGrams(entry.neededGrams);
        const deficit = cleanGrams(Math.max(0, needed - pantryGrams));
        const isForced = Boolean(state.forceBuy[entry.normName]);

        const enriched = {
          ...entry,
          neededGrams: needed,
          pantryGrams: cleanGrams(pantryGrams),
          buyGrams: deficit > 0 ? deficit : needed, // Bei "Doch kaufen" die volle benötigte Menge anzeigen
          status: deficit === 0 ? (isForced ? 'forced' : 'covered') : (pantryGrams > 0 ? 'partial' : 'missing'),
          checked: Boolean(state.checkedShopping[entry.normName]),
          sourcesList: Array.from(entry.sources),
        };

        if (deficit > 0 || isForced) {
          toBuy.push(enriched);
        } else {
          fromPantry.push(enriched);
        }
      });

      // Sortieren nach Kategorie & Name für schnelles Einkaufen
      const sortByCatAndName = (a, b) => {
        const catDiff = PANTRY_CATEGORIES.indexOf(a.category) - PANTRY_CATEGORIES.indexOf(b.category);
        if (catDiff !== 0) return catDiff;
        return a.name.localeCompare(b.name, 'de');
      };

      toBuy.sort(sortByCatAndName);
      fromPantry.sort(sortByCatAndName);

      return {
        toBuy,
        fromPantry,
        skippedPreppedBases: Array.from(skippedPreppedBases.values()),
      };
    }

    // =========================================================================
    // 6. PERSISTENZ-LAYER (FIREBASE FIRESTORE + LOKALER FALLBACK)
    // =========================================================================

    function userCol(colName) {
      return collection(db, 'artifacts', appId, 'users', currentUser.uid, colName);
    }

    function userDoc(colName, docId) {
      return doc(db, 'artifacts', appId, 'users', currentUser.uid, colName, docId);
    }

    async function persistDoc(colName, docId, payload) {
      if (state.storageMode !== 'cloud' || !db || !currentUser) return;
      try {
        await setDoc(userDoc(colName, docId), payload);
      } catch (err) {
        console.error(`Fehler beim Speichern (${colName}/${docId}):`, err);
        showToast('Änderung lokal aktiv (Cloud-Sync gerade nicht erreichbar)', 'warn');
      }
    }

    async function removeDoc(colName, docId) {
      if (state.storageMode !== 'cloud' || !db || !currentUser) return;
      try {
        await deleteDoc(userDoc(colName, docId));
      } catch (err) {
        console.error(`Fehler beim Löschen (${colName}/${docId}):`, err);
      }
    }

    async function persistSettings() {
      await persistDoc('appMeta', 'settings', {
        preppedBases: state.preppedBases,
        forceBuy: state.forceBuy,
        checkedShopping: state.checkedShopping,
        showSpoons: state.showSpoons,
        updatedAt: Date.now(),
      });
    }

    /** Einmaliges Befüllen der Firestore-Datenbank, falls noch keine Daten vorhanden sind */
    async function seedCloudIfEmpty() {
      const initRef = userDoc('appMeta', 'init');
      const initSnap = await getDoc(initRef);
      if (initSnap.exists()) return;

      const seed = getSeedData();
      const writes = [];

      seed.bases.forEach((b) => writes.push(setDoc(userDoc('bases', b.id), b)));
      seed.recipes.forEach((r) => writes.push(setDoc(userDoc('recipes', r.id), r)));
      seed.pantry.forEach((p) => writes.push(setDoc(userDoc('pantry', p.id), p)));
      seed.mealPlan.forEach((m) => writes.push(setDoc(userDoc('mealPlan', m.id), m)));
      writes.push(
        setDoc(userDoc('appMeta', 'settings'), {
          preppedBases: {},
          forceBuy: {},
          checkedShopping: {},
          showSpoons: true,
          updatedAt: Date.now(),
        })
      );
      writes.push(setDoc(initRef, { seeded: true, version: 1, createdAt: Date.now() }));

      await Promise.all(writes);
    }

    /** Abonniert alle Collections in Echtzeit (ohne komplexe Queries) */
    function attachFirestoreListeners() {
      unsubscribers.forEach((fn) => fn());
      unsubscribers = [];

      const onErr = (label) => (err) => {
        console.error(`Firestore Listener Fehler (${label}):`, err);
      };

      unsubscribers.push(
        onSnapshot(userCol('pantry'), (snap) => {
          state.pantry = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          renderApp();
        }, onErr('pantry'))
      );

      unsubscribers.push(
        onSnapshot(userCol('bases'), (snap) => {
          state.bases = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          renderApp();
        }, onErr('bases'))
      );

      unsubscribers.push(
        onSnapshot(userCol('recipes'), (snap) => {
          state.recipes = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          renderApp();
        }, onErr('recipes'))
      );

      unsubscribers.push(
        onSnapshot(userCol('mealPlan'), (snap) => {
          state.mealPlan = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          renderApp();
        }, onErr('mealPlan'))
      );

      unsubscribers.push(
        onSnapshot(userDoc('appMeta', 'settings'), (snap) => {
          if (snap.exists()) {
            const data = snap.data();
            state.preppedBases = data.preppedBases || {};
            state.forceBuy = data.forceBuy || {};
            state.checkedShopping = data.checkedShopping || {};
            if (typeof data.showSpoons === 'boolean') state.showSpoons = data.showSpoons;
            renderApp();
          }
        }, onErr('settings'))
      );
    }

    /** Initialisiert Firebase (falls konfiguriert) oder startet sofort im lokalen Fallback */
    async function initAppStorage() {
      try {
        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
          const config = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
          if (config && config.apiKey) {
            const fbApp = initializeApp(config);
            auth = getAuth(fbApp);
            db = getFirestore(fbApp);

            // REGEL 3: Authentifizierung zwingend VOR allen Firestore-Abfragen
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }

            currentUser = auth.currentUser;
            if (currentUser) {
              state.storageMode = 'cloud';
              await seedCloudIfEmpty();
              attachFirestoreListeners();
              state.initialized = true;
              updateSyncIndicator();
              return;
            }
          }
        }
      } catch (err) {
        console.warn('Cloud-Speicher nicht verfügbar, starte mit lokalem Fallback:', err);
      }

      // Nahtloser lokaler Fallback mit Beispieldaten
      loadLocalSeedData();
      state.storageMode = 'memory';
      state.initialized = true;
      updateSyncIndicator();
      renderApp();
    }

    function loadLocalSeedData() {
      const seed = getSeedData();
      state.bases = seed.bases;
      state.recipes = seed.recipes;
      state.pantry = seed.pantry;
      state.mealPlan = seed.mealPlan;
      state.preppedBases = {};
      state.forceBuy = {};
      state.checkedShopping = {};
    }

    async function resetToSampleData() {
      const seed = getSeedData();

      if (state.storageMode === 'cloud' && db && currentUser) {
        try {
          // Bestehende Dokumente entfernen und sauber neu anlegen
          const deletes = [
            ...state.pantry.map((p) => deleteDoc(userDoc('pantry', p.id))),
            ...state.bases.map((b) => deleteDoc(userDoc('bases', b.id))),
            ...state.recipes.map((r) => deleteDoc(userDoc('recipes', r.id))),
            ...state.mealPlan.map((m) => deleteDoc(userDoc('mealPlan', m.id))),
          ];
          await Promise.all(deletes);

          const writes = [
            ...seed.bases.map((b) => setDoc(userDoc('bases', b.id), b)),
            ...seed.recipes.map((r) => setDoc(userDoc('recipes', r.id), r)),
            ...seed.pantry.map((p) => setDoc(userDoc('pantry', p.id), p)),
            ...seed.mealPlan.map((m) => setDoc(userDoc('mealPlan', m.id), m)),
            setDoc(userDoc('appMeta', 'settings'), {
              preppedBases: {},
              forceBuy: {},
              checkedShopping: {},
              showSpoons: state.showSpoons,
              updatedAt: Date.now(),
            }),
          ];
          await Promise.all(writes);
          showToast('Beispieldaten wurden frisch wiederhergestellt.', 'success');
          return;
        } catch (err) {

        ...state.checkedShopping,

      };
      renderApp();
      await persistSettings();

    async function toggleForceBuy(normName, ingredientName) {
      const next = !state.forceBuy[normName];
      state.forceBuy = { ...state.forceBuy, [normName]: next };
      if (!next && state.checkedShopping[normName]) {
        const nextChecked = { ...state.checkedShopping };
        delete nextChecked[normName];
        state.checkedShopping = nextChecked;
      }
      renderApp();
      await persistSettings();
      showToast(
        next
          ? `„${ingredientName}“ auf die Einkaufsliste verschoben.`
          : `„${ingredientName}“ wieder im Vorrats-Abgleich.`,
        'info'
      );

    /** Bucht alle abgehakten Einkäufe direkt mit ihrer Kaufmenge in die Vorrats-Datenbank */
    async function bookCheckedToPantry() {
      const { toBuy } = computeShoppingList();
      const checkedItems = toBuy.filter((item) => item.checked);
      if (checkedItems.length === 0) return;

      const updatedPantry = [...state.pantry];
      const changedDocs = [];
      const nextChecked = { ...state.checkedShopping };
      const nextForceBuy = { ...state.forceBuy };

      checkedItems.forEach((item) => {
        const existingIdx = updatedPantry.findIndex((p) => normalizeName(p.name) === item.normName);
        if (existingIdx >= 0) {
          const updated = {
            ...updatedPantry[existingIdx],
            amountGrams: cleanGrams((Number(updatedPantry[existingIdx].amountGrams) || 0) + item.buyGrams),
          };
          updatedPantry[existingIdx] = updated;
          changedDocs.push(updated);
        } else {
          const created = {
            id: generateId('pan'),
            name: item.name,
            category: item.category || 'Trockenvorrat',
            amountGrams: cleanGrams(item.buyGrams),
          };
          updatedPantry.push(created);
          changedDocs.push(created);
        }
        delete nextChecked[item.normName];
        delete nextForceBuy[item.normName];
      });

      state.pantry = updatedPantry;
      state.checkedShopping = nextChecked;
      state.forceBuy = nextForceBuy;
      renderApp();

      await Promise.all([
        ...changedDocs.map((p) => persistDoc('pantry', p.id, p)),
        persistSettings(),
      ]);

      showToast(`${checkedItems.length} ${checkedItems.length === 1 ? 'Zutat' : 'Zutaten'} erfolgreich in den Vorrat gebucht!`, 'success');
    }

    async function adjustPantryAmount(pantryId, deltaGrams) {
      const idx = state.pantry.findIndex((p) => p.id === pantryId);
      if (idx < 0) return;
      const current = state.pantry[idx];
      const nextAmount = Math.max(0, cleanGrams((Number(current.amountGrams) || 0) + deltaGrams));
      const updated = { ...current, amountGrams: nextAmount };
      state.pantry = state.pantry.map((p) => (p.id === pantryId ? updated : p));
      renderApp();
      await persistDoc('pantry', updated.id, updated);
    }

    async function savePantryItem(itemData) {
      const isEdit = Boolean(itemData.id);
      const item = {
        id: itemData.id || generateId('pan'),
        name: itemData.name.trim(),
        category: itemData.category || 'Trockenvorrat',
        amountGrams: Math.max(0, cleanGrams(Number(itemData.amountGrams) || 0)),
      };

      if (isEdit) {
        state.pantry = state.pantry.map((p) => (p.id === item.id ? item : p));
      } else {
        // Falls gleicher Name schon existiert, addieren oder aktualisieren
        const existing = getPantryItemByName(item.name);
        if (existing) {
          item.id = existing.id;
          item.amountGrams = cleanGrams((Number(existing.amountGrams) || 0) + item.amountGrams);
          state.pantry = state.pantry.map((p) => (p.id === item.id ? item : p));
        } else {
          state.pantry = [...state.pantry, item];
        }
      }

      closeModal();
      renderApp();
      await persistDoc('pantry', item.id, item);
      showToast(`„${item.name}“ im Vorrat gespeichert.`, 'success');
    }

    async function deletePantryItem(pantryId) {
      const item = state.pantry.find((p) => p.id === pantryId);
      state.pantry = state.pantry.filter((p) => p.id !== pantryId);
      closeModal();
      renderApp();
      await removeDoc('pantry', pantryId);
      if (item) showToast(`„${item.name}“ aus dem Vorrat entfernt.`, 'info');
    }

    async function saveRecipe(recipeData) {
      const isEdit = Boolean(recipeData.id);
      const recipe = {
        id: recipeData.id || generateId('rec'),
        name: recipeData.name.trim(),
        description: (recipeData.description || '').trim(),
        defaultServings: Math.max(1, parseInt(recipeData.defaultServings, 10) || 4),
        prepTimeMinutes: Math.max(1, parseInt(recipeData.prepTimeMinutes, 10) || 25),
        baseId: recipeData.baseId || null,
        baseAmountGrams: recipeData.baseId ? Math.max(1, Number(recipeData.baseAmountGrams) || 400) : 0,
        ingredients: (recipeData.ingredients || [])
          .filter((i) => i.name && i.name.trim() && Number(i.amountGrams) > 0)
          .map((i) => ({
            name: i.name.trim(),
            amountGrams: cleanGrams(Number(i.amountGrams)),
            category: i.category || 'Trockenvorrat',
          })),
        steps: (recipeData.steps || []).map((s) => s.trim()).filter(Boolean),
      };

      if (isEdit) {
        state.recipes = state.recipes.map((r) => (r.id === recipe.id ? recipe : r));
      } else {
        state.recipes = [...state.recipes, recipe];
      }

      closeModal();
      renderApp();
      await persistDoc('recipes', recipe.id, recipe);
      showToast(`Rezept „${recipe.name}“ gespeichert.`, 'success');

    async function deleteRecipe(recipeId) {
      const rec = getRecipeById(recipeId);
      const removedMeals = state.mealPlan.filter((m) => m.recipeId === recipeId);
      state.recipes = state.recipes.filter((r) => r.id !== recipeId);

      closeModal();
      renderApp();
      await Promise.all([
        removeDoc('recipes', recipeId),
        ...removedMeals.map((m) => removeDoc('mealPlan', m.id)),

    async function saveBase(baseData) {

      const base = {

        description: (baseData.description || '').trim(),

        ingredients: (baseData.ingredients || [])

    async function deleteBase(baseId) {
      const base = getBaseById(baseId);
      // Verknüpfungen in Rezepten sauber lösen
      const affectedRecipes = state.recipes.filter((r) => r.baseId === baseId);
      const updatedRecipes = affectedRecipes.map((r) => ({ ...r, baseId: null, baseAmountGrams: 0 }));

      state.bases = state.bases.filter((b) => b.id !== baseId);
      state.recipes = state.recipes.map((r) => (r.baseId === baseId ? { ...r, baseId: null, baseAmountGrams: 0 } : r));

    function showToast(message, type = 'info') {
      const root = document.getElementById('toast-root');
      if (!root) return;

      const styles = {
        success: 'bg-sage-700 text-white border-sage-600',
        warn: 'bg-amber-700 text-white border-amber-600',
        info: 'bg-charcoal-800 text-white border-charcoal-700',
      };

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto max-w-sm px-4 py-3 rounded-2xl shadow-lg border text-sm font-medium flex items-center gap-2.5 animate-fade-up ${styles[type] || styles.info}`;
      toast.innerHTML = `<span>${escapeHtml(message)}</span>`;
      root.appendChild(toast);

      setTimeout(() => {
        toast.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(6px)';
        setTimeout(() => toast.remove(), 260);
      }, 3200);
    }

                <span>Gericht</span>

                : `
                <div class="space-y-2.5">
                  ${dayMeals
                    .map((meal) => {
                      const recipe = getRecipeById(meal.recipeId);
                      if (!recipe) return '';
                      const base = recipe.baseId ? getBaseById(recipe.baseId) : null;
                      const basePrepped = base && state.preppedBases[base.id];
                      const match = computeRecipePantryMatch(recipe, meal.servings);

                      return `
                        <div class="group relative bg-cream-50 hover:bg-sage-50/60 border border-cream-200 hover:border-sage-300 rounded-xl p-3 transition-all">

                                    ? 'bg-emerald-50 text-emerald-700'

                                    ? 'bg-amber-50 text-amber-700'
                                    : 'bg-cream-200 text-charcoal-600'
                                }">

                                </span>
                              </div>
                              ${
                                base

                                <div class="mt-2 inline-flex items-center gap-1 text-[11px] font-medium px-2 py-0.5 rounded-lg ${

                                    ? 'bg-emerald-100/80 text-emerald-800'

                                }">

                                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                                </svg>
                              </button>
                            </div>
                          </div>
                        </div>
                      `;

                    .join('')}

          </div>

      }).join('');

      // Intelligente Rezept-Vorschläge Sidebar / Bereich
      const suggestionsHTML = `
        <aside class="bg-white rounded-3xl border border-cream-300/80 shadow-soft p-4 sm:p-5 h-fit lg:sticky lg:top-24">

            <div>

          <div class="${state.mobileSuggestionsOpen ? 'block' : 'hidden'} lg:block space-y-3">

      return `

            <div class="flex items-center gap-2">

    // =========================================================================
    // 11. ANSICHT 3: VORRATS-DATENBANK
    // =========================================================================

    function renderPantryView() {
      const searchNorm = normalizeName(state.pantrySearch);
      const filtered = state.pantry
        .filter((item) => {
          const matchesCat = state.pantryCategory === 'Alle' || item.category === state.pantryCategory;
          const matchesSearch = !searchNorm || normalizeName(item.name).includes(searchNorm) || normalizeName(item.category).includes(searchNorm);
          return matchesCat && matchesSearch;
        })
        .sort((a, b) => a.name.localeCompare(b.name, 'de'));

      const totalWeightKg = state.pantry.reduce((acc, p) => acc + (Number(p.amountGrams) || 0), 0) / 1000;

      return `
        <div class="animate-fade-up space-y-5">
          <!-- Header -->
          <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-3">
            <div>
              <h2 class="text-2xl font-bold tracking-tight text-charcoal-900">Vorrats-Datenbank</h2>
              <p class="text-sm text-charcoal-500 mt-0.5">
                ${state.pantry.length} Zutaten erfasst · Gesamtbestand ca. ${formatNumberDE(totalWeightKg, 1)} kg
              </p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button type="button" data-action="export-pantry-csv"

    function renderRecipesView() {
      const searchNorm = normalizeName(state.recipeSearch);

      // Basis-Gruppierung für Übersicht & Basen-Tab
      const baseGroups = state.bases.map((base) => ({
        base,
        linkedRecipes: state.recipes.filter((r) => r.baseId === base.id),

            state.recipeBaseFilter === 'Alle' ||
            (state.recipeBaseFilter === 'none' ? !r.baseId : r.baseId === state.recipeBaseFilter);
          const matchesSearch =
            !searchNorm ||
            normalizeName(r.name).includes(searchNorm) ||
            normalizeName(r.description).includes(searchNorm) ||
            (r.ingredients || []).some((i) => normalizeName(i.name).includes(searchNorm));

                  </div>

                    <button type="button" data-action="open-batch-prep" data-base-id="${base.id}" data-total-grams="${base.yieldGrams}"
                      class="px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-sage-500 hover:bg-sage-600 text-white transition-colors">
                      Zubereitung öffnen
                    </button>
                    <div class="flex items-center gap-1">
                      <button type="button" data-action="open-base-modal" data-id="${base.id}"
                        class="p-1.5 rounded-lg text-charcoal-400 hover:text-sage-700 hover:bg-sage-50" title="Bearbeiten">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                        </svg>
                      </button>
                      <button type="button" data-action="confirm-delete-base" data-id="${base.id}"
                        class="p-1.5 rounded-lg text-charcoal-400 hover:text-terracotta-600 hover:bg-terracotta-50" title="Löschen">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                      </button>
                    </div>
                  </div>
                </article>
              `
                )
                .join('')}
            </div>
          `
          }
        </div>
      `;
    }

    // =========================================================================
    // 13. MODALS: KOCHMODUS, BATCH-PREP, FORMULARE & BESTÄTIGUNGEN
    // =========================================================================

    function openModal(type, data = {}) {
      state.modal = { type, data };
      document.body.classList.add('modal-open');
      renderModal();
    }

    function closeModal() {
      state.modal = null;
      document.body.classList.remove('modal-open');
      const root = document.getElementById('modal-root');
      if (root) {
        root.classList.add('hidden');
        root.innerHTML = '';
      }
    }

    function openCookModal(recipeId, servings) {
      const recipe = getRecipeById(recipeId);
      if (!recipe) return;
      const isBasePrepped = recipe.baseId ? Boolean(state.preppedBases[recipe.baseId]) : false;
      openModal('cook', {
        recipeId,
        servings: Number(servings) || recipe.defaultServings || 4,
        // Wenn Basis bereits als vorgekocht markiert ist, standardmäßig eingeklappt starten
        baseIngredientsCollapsed: isBasePrepped,
        baseStepsCollapsed: isBasePrepped,
        checkedBaseIngs: {},
        checkedMainIngs: {},
        checkedBaseSteps: {},
        checkedMainSteps: {},
      });
    }

    function renderCookModalContent(m) {
      const recipe = getRecipeById(m.recipeId);
      if (!recipe) return '';

      const details = getScaledRecipeDetails(recipe, m.servings);
      const allBaseCollapsed = m.baseIngredientsCollapsed && m.baseStepsCollapsed;
      const isBasePrepped = details.base && Boolean(state.preppedBases[details.base.id]);

      return `
        <div class="bg-cream-50 w-full max-w-3xl max-h-[92vh] rounded-3xl shadow-2xl border border-cream-300 flex flex-col overflow-hidden animate-fade-up">
          <!-- Modal Header -->
          <div class="px-5 sm:px-6 py-4 bg-white border-b border-cream-200 flex items-start justify-between gap-3">
            <div>
              <div class="flex flex-wrap items-center gap-2">
                <span class="text-[11px] font-semibold uppercase tracking-wider text-sage-600 bg-sage-50 px-2 py-0.5 rounded-md">Kochmodus</span>

              </div>
              <h2 class="text-xl sm:text-2xl font-bold text-charcoal-900 mt-1">${escapeHtml(recipe.name)}</h2>
            </div>
            <button type="button" data-action="close-modal"
              class="p-2 rounded-xl text-charcoal-400 hover:text-charcoal-800 hover:bg-cream-100 transition-colors">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>

          <!-- Steuerleiste: Portionsrechner & Einheiten-Umschalter -->
          <div class="px-5 sm:px-6 py-3 bg-cream-100/90 border-b border-cream-200 flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-2">
              <span class="text-xs font-semibold text-charcoal-600">Portionen:</span>
              <div class="inline-flex items-center bg-white rounded-xl border border-cream-300 p-0.5">
                ${[2, 4, 6]
                  .map(
                    (p) => `
                  <button type="button" data-cook-servings="${p}"
                    class="px-2.5 py-1 rounded-lg text-xs font-semibold transition-all ${
                      m.servings === p ? 'bg-sage-600 text-white' : 'text-charcoal-600 hover:bg-cream-100'
                    }">${p}</button>

                  .join('')}
              </div>
              <div class="inline-flex items-center gap-1 ml-1">
                <button type="button" data-cook-servings="${Math.max(1, m.servings - 1)}"
                  class="w-7 h-7 rounded-lg bg-white border border-cream-300 text-charcoal-700 font-bold text-xs hover:bg-cream-100">−</button>
                <span class="text-xs font-bold w-6 text-center text-charcoal-900">${m.servings}</span>
                <button type="button" data-cook-servings="${m.servings + 1}"

              </div>
            </div>

            <button type="button" data-action="toggle-global-units"
              class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold border transition-colors ${
                state.showSpoons
                  ? 'bg-sage-600 text-white border-sage-600'
                  : 'bg-white text-charcoal-700 border-cream-300 hover:border-sage-400'

              <span>${state.showSpoons ? '✓ Gramm + TL/EL aktiv' : 'Gramm exakt (TL/EL an)'}</span>
            </button>
          </div>

          <!-- Scrollbarer Rezept-Inhalt -->
          <div class="flex-1 overflow-y-auto px-5 sm:px-6 py-5 space-y-6">
            ${
              details.base
                ? `
              <!-- ==================== REZEPT-BASIS KARTE (EINKLAPPBAR) ==================== -->
              <section class="rounded-3xl border-2 border-sage-300/80 bg-gradient-to-br from-sage-50 to-white overflow-hidden shadow-sm">
                <div class="p-4 sm:p-5 border-b border-sage-200/70 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div>
                    <div class="flex flex-wrap items-center gap-2">
                      <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-sage-600 text-white">
                        🧩 Enthält Rezept-Basis
                      </span>
                      <span class="text-xs font-bold text-sage-800 bg-sage-100 px-2 py-0.5 rounded-lg">
                        Benötigt: ${formatNumberDE(cleanGrams(details.scaledBaseGrams), 0)} g
                      </span>
                      ${
                        isBasePrepped
                          ? `<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800">✓ Im Wochenplan als vorgekocht markiert</span>`
                          : ''
                      }
                    </div>
                    <h3 class="text-base sm:text-lg font-bold text-charcoal-900 mt-1.5">
                      ${escapeHtml(details.base.name)}
                    </h3>
                  </div>

                  <!-- Master-Toggle: Basis komplett überspringen / anzeigen -->
                  <button type="button" data-cook-toggle="all-base"
                    class="shrink-0 inline-flex items-center justify-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-semibold transition-all border ${
                      allBaseCollapsed
                        ? 'bg-sage-600 text-white border-sage-600 hover:bg-sage-700'
                        : 'bg-white text-sage-800 border-sage-300 hover:bg-sage-100'
                    }">
                    <svg class="w-4 h-4 transition-transform ${allBaseCollapsed ? 'rotate-180' : ''}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" />
                    </svg>
                    <span>${allBaseCollapsed ? 'Basis komplett anzeigen' : 'Basis schon fertig? Alles einklappen'}</span>
                  </button>
                </div>

                <div class="p-4 sm:p-5 space-y-3">
                  <!-- Einklappbarer Block 1: Basis-Zutaten -->
                  <div class="bg-white rounded-2xl border border-sage-200/80 overflow-hidden">
                    <button type="button" data-cook-toggle="base-ings"
                      class="w-full px-4 py-3 flex items-center justify-between gap-2 text-left hover:bg-sage-50/50 transition-colors">
                      <div class="flex items-center gap-2">
                        <span class="text-sm font-bold text-charcoal-900">Basis-Zutaten</span>
                        <span class="text-xs text-charcoal-500">(${details.baseIngredients.length} Zutaten)</span>
                      </div>
                      <span class="inline-flex items-center gap-1 text-xs font-semibold text-sage-700">
                        <span>${m.baseIngredientsCollapsed ? 'Aufklappen' : 'Basis-Zutaten einklappen / überspringen'}</span>
                        <svg class="w-4 h-4 transition-transform ${m.baseIngredientsCollapsed ? 'rotate-180' : ''}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" />
                        </svg>
                      </span>
                    </button>

                    ${
                      m.baseIngredientsCollapsed
                        ? ''
                        : `
                      <div class="px-4 pb-3 pt-1 border-t border-sage-100">
                        <ul class="divide-y divide-cream-100">
                          ${details.baseIngredients
                            .map((ing, idx) => {
                              const checked = Boolean(m.checkedBaseIngs[idx]);
                              return `
                                <li class="py-2 flex items-center justify-between gap-2">
                                  <button type="button" data-cook-check="base-ing" data-idx="${idx}"
                                    class="flex items-center gap-2.5 text-left flex-1">
                                    <span class="w-5 h-5 rounded-md border flex items-center justify-center text-xs shrink-0 ${
                                      checked ? 'bg-sage-600 border-sage-600 text-white' : 'border-charcoal-300 bg-white'
                                    }">${checked ? '✓' : ''}</span>
                                    <span class="text-sm ${checked ? 'line-through text-charcoal-400' : 'text-charcoal-800'}">
                                      ${escapeHtml(ing.name)}
                                    </span>
                                  </button>
                                  <div class="text-sm ${checked ? 'opacity-40' : ''}">
                                    ${formatAmountHTML(ing.amountGrams, ing.name)}
                                  </div>
                                </li>
                              `;
                            })
                            .join('')}
                        </ul>
                      </div>
                    `
                    }
                  </div>

                  <!-- Einklappbarer Block 2: Basis-Zubereitung -->
                  <div class="bg-white rounded-2xl border border-sage-200/80 overflow-hidden">
                    <button type="button" data-cook-toggle="base-steps"
                      class="w-full px-4 py-3 flex items-center justify-between gap-2 text-left hover:bg-sage-50/50 transition-colors">
                      <div class="flex items-center gap-2">
                        <span class="text-sm font-bold text-charcoal-900">Basis-Zubereitung</span>
                        <span class="text-xs text-charcoal-500">(${(details.base.steps || []).length} Schritte)</span>
                      </div>
                      <span class="inline-flex items-center gap-1 text-xs font-semibold text-sage-700">
                        <span>${m.baseStepsCollapsed ? 'Aufklappen' : 'Basis-Zubereitung einklappen / schon vorgekocht'}</span>
                        <svg class="w-4 h-4 transition-transform ${m.baseStepsCollapsed ? 'rotate-180' : ''}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" />
                        </svg>
                      </span>
                    </button>

                    ${
                      m.baseStepsCollapsed
                        ? ''
                        : `
                      <div class="px-4 pb-4 pt-2 border-t border-sage-100 space-y-2">
                        ${(details.base.steps || [])
                          .map((step, idx) => {
                            const checked = Boolean(m.checkedBaseSteps[idx]);
                            return `
                              <button type="button" data-cook-check="base-step" data-idx="${idx}"
                                class="w-full text-left flex items-start gap-3 p-2.5 rounded-xl transition-colors ${
                                  checked ? 'bg-sage-50/70 text-charcoal-400' : 'hover:bg-cream-50 text-charcoal-800'
                                }">
                                <span class="w-6 h-6 rounded-full text-xs font-bold flex items-center justify-center shrink-0 mt-0.5 ${
                                  checked ? 'bg-sage-600 text-white' : 'bg-sage-100 text-sage-800'

                                <span class="text-sm leading-relaxed ${checked ? 'line-through' : ''}">${escapeHtml(step)}</span>

                  </div>
                </div>
              </section>

            <!-- ==================== HAUPTZUTATEN ==================== -->
            <section class="bg-white rounded-3xl border border-cream-300/80 p-4 sm:p-5 shadow-soft">
              <div class="flex items-center justify-between mb-3">
                <h3 class="text-base font-bold text-charcoal-900">
                  ${details.base ? 'Weitere Zutaten für das Gericht' : 'Zutaten'}
                </h3>
                <span class="text-xs text-charcoal-500">Zum Abhaken antippen</span>
              </div>

              <ul class="divide-y divide-cream-200">
                ${
                  details.base
                    ? `
                  <li class="py-2.5 flex items-center justify-between gap-2 bg-sage-50/60 -mx-2 px-2 rounded-xl mb-1">
                    <div class="flex items-center gap-2.5">
                      <span class="w-5 h-5 rounded-md bg-sage-600 text-white flex items-center justify-center text-xs shrink-0">🧩</span>
                      <span class="text-sm font-semibold text-sage-900">${escapeHtml(details.base.name)} (fertig)</span>
                    </div>
                    <span class="text-sm font-bold text-sage-800">${formatNumberDE(cleanGrams(details.scaledBaseGrams), 0)} g</span>
                  </li>
                `
                    : ''
                }
                ${details.mainIngredients
                  .map((ing, idx) => {
                    const checked = Boolean(m.checkedMainIngs[idx]);
                    const pantryG = getPantryGrams(ing.name);
                    const inStock = pantryG >= ing.amountGrams - 0.01;
                    return `
                      <li class="py-2.5 flex items-center justify-between gap-3">
                        <button type="button" data-cook-check="main-ing" data-idx="${idx}"
                          class="flex items-center gap-2.5 text-left flex-1 min-w-0">
                          <span class="w-5 h-5 rounded-md border flex items-center justify-center text-xs shrink-0 ${
                            checked ? 'bg-sage-600 border-sage-600 text-white' : 'border-charcoal-300 bg-white'
                          }">${checked ? '✓' : ''}</span>
                          <span class="text-sm font-medium ${checked ? 'line-through text-charcoal-400' : 'text-charcoal-900'} truncate">
                            ${escapeHtml(ing.name)}
                          </span>
                          ${
                            inStock
                              ? `<span class="hidden sm:inline-block text-[10px] font-medium px-1.5 py-0.5 rounded bg-sage-50 text-sage-700">im Vorrat</span>`
                              : ''
                          }
                        </button>
                        <div class="text-sm shrink-0 ${checked ? 'opacity-40' : ''}">
                          ${formatAmountHTML(ing.amountGrams, ing.name)}

                      </li>
                    `;

                  .join('')}
              </ul>
            </section>

            <!-- ==================== KOCHANLEITUNG ==================== -->
            <section class="bg-white rounded-3xl border border-cream-300/80 p-4 sm:p-5 shadow-soft">
              <div class="flex items-center justify-between mb-3">
                <h3 class="text-base font-bold text-charcoal-900">Kochanleitung</h3>
                <span class="text-xs text-charcoal-500">Schritte abhakbar</span>
              </div>

              <div class="space-y-2.5">
                ${(recipe.steps || [])
                  .map((step, idx) => {
                    const checked = Boolean(m.checkedMainSteps[idx]);
                    return `
                      <button type="button" data-cook-check="main-step" data-idx="${idx}"
                        class="w-full text-left flex items-start gap-3.5 p-3 rounded-2xl border transition-all ${
                          checked
                            ? 'bg-sage-50/70 border-sage-200 text-charcoal-400'
                            : 'bg-cream-50/60 border-cream-200 hover:border-sage-300 text-charcoal-800'
                        }">
                        <span class="w-7 h-7 rounded-full text-xs font-bold flex items-center justify-center shrink-0 mt-0.5 ${
                          checked ? 'bg-sage-600 text-white' : 'bg-white border border-cream-300 text-charcoal-800'
                        }">
                          ${checked ? '✓' : idx + 1}
                        </span>
                        <span class="text-sm leading-relaxed ${checked ? 'line-through' : ''}">${escapeHtml(step)}</span>
                      </button>
                    `;
                  })
                  .join('')}
              </div>
            </section>
          </div>
        </div>
      `;
    }

    /** Batch-Prep Modal für das Vorkochen einer gesamten Wochen-Basis (z. B. 1.200 g Tomatensoße) */
    function renderBatchPrepModalContent(m) {
      const base = getBaseById(m.baseId);
      if (!base) return '';
      const totalGrams = Number(m.totalGrams) || base.yieldGrams || 400;
      const factor = base.yieldGrams > 0 ? totalGrams / base.yieldGrams : 1;
      const isPrepped = Boolean(state.preppedBases[base.id]);

      return `
        <div class="bg-cream-50 w-full max-w-2xl max-h-[90vh] rounded-3xl shadow-2xl border border-cream-300 flex flex-col overflow-hidden animate-fade-up">
          <div class="px-5 py-4 bg-white border-b border-cream-200 flex items-start justify-between gap-3">
            <div>
              <span class="text-[11px] font-bold uppercase tracking-wider text-sage-600">Meal-Prep Batch-Anleitung</span>
              <h2 class="text-xl font-bold text-charcoal-900 mt-0.5">${escapeHtml(base.name)}</h2>
              <p class="text-xs text-charcoal-500 mt-0.5">Skaliert auf <strong>${formatNumberDE(totalGrams, 0)} g</strong> (${formatNumberDE(factor, 1)}× Grundrezept)</p>
            </div>
            <button type="button" data-action="close-modal" class="p-2 rounded-xl text-charcoal-400 hover:bg-cream-100">✕</button>
          </div>

          <div class="flex-1 overflow-y-auto p-5 space-y-5">
            <div class="bg-white rounded-2xl border border-cream-200 p-4">
              <h3 class="text-sm font-bold text-charcoal-900 mb-2.5">Benötigte Zutaten für ${formatNumberDE(totalGrams, 0)} g</h3>
              <ul class="divide-y divide-cream-100">
                ${(base.ingredients || [])
                  .map(
                    (ing) => `
                  <li class="py-2 flex items-center justify-between gap-2 text-sm">
                    <span class="text-charcoal-800">${escapeHtml(ing.name)}</span>
                    <div>${formatAmountHTML(ing.amountGrams * factor, ing.name)}</div>
                  </li>
                `
                  )
                  .join('')}
              </ul>
            </div>

            <div class="bg-white rounded-2xl border border-cream-200 p-4 space-y-2.5">
              <h3 class="text-sm font-bold text-charcoal-900">Zubereitung</h3>
              ${(base.steps || [])
                .map(
                  (step, idx) => `
                <div class="flex items-start gap-3 text-sm text-charcoal-800">
                  <span class="w-6 h-6 rounded-full bg-sage-100 text-sage-800 font-bold text-xs flex items-center justify-center shrink-0 mt-0.5">${idx + 1}</span>
                  <p class="leading-relaxed">${escapeHtml(step)}</p>
                </div>
              `
                )
                .join('')}
            </div>
          </div>

          <div class="px-5 py-3.5 bg-white border-t border-cream-200 flex items-center justify-between gap-3">
            <button type="button" data-action="toggle-prepped" data-base-id="${base.id}"
              class="px-4 py-2 rounded-xl text-xs font-semibold transition-colors ${
                isPrepped ? 'bg-sage-600 text-white' : 'bg-sage-100 text-sage-800 hover:bg-sage-200'
              }">
              ${isPrepped ? '✓ Als vorgekocht markiert' : 'Als vorgekocht markieren'}
            </button>
            <button type="button" data-action="close-modal"
              class="px-4 py-2 rounded-xl text-xs font-semibold bg-charcoal-800 text-white hover:bg-charcoal-900">
              Schließen
            </button>
          </div>
        </div>
      `;
    }

    /** Modal: Gericht zum Wochenplan hinzufügen */
    function renderAddMealModalContent(m) {
      const selectedDay = m.day || 'Montag';
      const selectedRecipeId = m.recipeId || (state.recipes[0] ? state.recipes[0].id : '');
      const selectedRecipe = getRecipeById(selectedRecipeId);
      const defaultServings = selectedRecipe ? selectedRecipe.defaultServings : 4;

      return `
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl border border-cream-300 overflow-hidden animate-fade-up">
          <div class="px-5 py-4 border-b border-cream-200 flex items-center justify-between">
            <h2 class="text-lg font-bold text-charcoal-900">Gericht einplanen</h2>
            <button type="button" data-action="close-modal" class="p-1.5 rounded-xl text-charcoal-400 hover:bg-cream-100">✕</button>
          </div>
          <form id="add-meal-form" class="p-5 space-y-4">
            <div>
              <label class="block text-xs font-semibold text-charcoal-700 mb-1.5">Wochentag</label>
              <select name="day" class="w-full rounded-xl border border-cream-300 bg-cream-50 px-3 py-2.5 text-sm focus:outline-none focus:border-sage-500">
                ${DAYS_OF_WEEK.map((d) => `<option value="${d}" ${d === selectedDay ? 'selected' : ''}>${d}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-charcoal-700 mb-1.5">Rezept auswählen</label>
              <select name="recipeId" class="w-full rounded-xl border border-cream-300 bg-cream-50 px-3 py-2.5 text-sm focus:outline-none focus:border-sage-500">
                ${state.recipes
                  .map((r) => {
                    const base = r.baseId ? getBaseById(r.baseId) : null;
                    return `<option value="${r.id}" ${r.id === selectedRecipeId ? 'selected' : ''}>${escapeHtml(r.name)}${base ? ` (${escapeHtml(base.name)})` : ''}</option>`;
                  })
                  .join('')}
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-charcoal-700 mb-1.5">Portionen</label>
              <input type="number" name="servings" min="1" max="20" value="${defaultServings}" required
                class="w-full rounded-xl border border-cream-300 bg-cream-50 px-3 py-2.5 text-sm focus:outline-none focus:border-sage-500" />
