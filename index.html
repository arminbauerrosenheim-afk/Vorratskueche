    /** Erkennt automatisch das wahrscheinlichste CSV-Trennzeichen (; , oder Tab) */
    function detectCSVDelimiter(rawText) {
      const sampleLines = rawText
        .replace(/^\uFEFF/, '')
        .split(/\r?\n/)
        .filter((l) => l.trim().length > 0)
        .slice(0, 6);
      const candidates = [';', ',', '\t'];
      let bestDelim = ';';
      let bestScore = -1;

      candidates.forEach((delim) => {
        let totalCount = 0;
        let inQuotes = false;
        sampleLines.forEach((line) => {
          for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (ch === '"') inQuotes = !inQuotes;
            else if (ch === delim && !inQuotes) totalCount++;
          }
        });
        if (totalCount > bestScore) {
          bestScore = totalCount;
          bestDelim = delim;
        }
      });

      return bestScore > 0 ? bestDelim : ';';
    }

    /** RFC-4180-konformer CSV-Parser mit sauberem Handling für Anführungszeichen & Zeilenumbrüche */
    function parseCSVText(rawText, delimiter = ';') {
      const text = String(rawText || '').replace(/^\uFEFF/, '');
      const rows = [];
      let row = [];
      let field = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];

        if (inQuotes) {
          if (ch === '"' && next === '"') {
            field += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            field += ch;
          }
        } else {
          if (ch === '"') {
            inQuotes = true;
          } else if (ch === delimiter) {
            row.push(field.trim());
            field = '';
          } else if (ch === '\r' && next === '\n') {
            row.push(field.trim());
            if (row.some((cell) => cell !== '')) rows.push(row);
            row = [];
            field = '';
            i++;
          } else if (ch === '\n' || ch === '\r') {
            row.push(field.trim());
            if (row.some((cell) => cell !== '')) rows.push(row);
            row = [];
            field = '';
          } else {
            field += ch;
          }
        }
      }

      if (field.length > 0 || row.length > 0) {
        row.push(field.trim());
        if (row.some((cell) => cell !== '')) rows.push(row);
      }

      if (rows.length === 0) return { headers: [], dataRows: [] };

      const headers = rows[0].map((h, idx) => h || `Spalte ${idx + 1}`);
      const dataRows = rows.slice(1);
      return { headers, dataRows };
    }

    /** Ordnet CSV-Spalten automatisch den passenden Zielfeldern zu */
    function autoMapColumns(headers, targetType) {
      const fields = targetType === 'pantry' ? PANTRY_MAPPING_FIELDS : RECIPE_MAPPING_FIELDS;
      const mapping = {};
      const usedIndices = new Set();

      fields.forEach((f) => {
        // 1. Exakter Treffer auf Alias
        let foundIdx = headers.findIndex((h, idx) => {
          if (usedIndices.has(idx)) return false;
          const normH = normalizeName(h).replace(/[^a-zäöüß0-9_]/g, '');
          return f.aliases.some((al) => normH === al);
        });
        // 2. Teilstring-Treffer auf Alias
        if (foundIdx === -1) {
          foundIdx = headers.findIndex((h, idx) => {
            if (usedIndices.has(idx)) return false;
            const normH = normalizeName(h).replace(/[^a-zäöüß0-9_]/g, '');
            return f.aliases.some((al) => normH.includes(al) || al.includes(normH));
          });
        }
        mapping[f.key] = foundIdx;
        if (foundIdx >= 0) usedIndices.add(foundIdx);
      });

      return mapping;
    }

    /** Schätzt eine passende Vorrats-Kategorie anhand des Zutatennamens */
    function guessIngredientCategory(name) {
      const existing = getPantryItemByName(name);
      if (existing) return existing.category;
      const n = normalizeName(name);
      if (/(öl|essig|salz|pfeffer|paprika|curry|oregano|kümmel|zimt|muskat|gewürz|senf|soja|honig|sirup|kräuter)/.test(n)) {
        return 'Gewürze & Öle';
      }
      if (/(dose|passiert|bohnen|mais|kokosmilch|tomatenmark|kichererbsen|glas|konserve|pesto)/.test(n)) {
        return 'Konserven & Gläser';
      }
      if (/(milch|käse|gouda|parmesan|butter|sahne|joghurt|quark|eier|hack|fleisch|hähnchen|tofu|spätzle|schinken)/.test(n)) {
        return 'Kühlschrank';
      }
      if (/(zwiebel|knoblauch|tomate|paprika|karotte|möhre|zucchini|brokkoli|spinat|salat|ingwer|basilikum|schnittlauch|petersilie|kartoffel|apfel|zitrone|gemüse)/.test(n)) {
        return 'Frisch & Gemüse';
      }
      return 'Trockenvorrat';
    }

    /** Rechnet Einheiten (kg, ml, l, EL, TL, Prise, Stk.) praxisnah in Gramm um */
    function convertToGrams(amount, unitRaw, ingredientName) {
      const val = Number(String(amount).replace(',', '.'));
      if (!val || val <= 0) return 0;
      const u = normalizeName(unitRaw || 'g').replace(/\./g, '');

      if (u === 'g' || u === 'gr' || u === 'gramm' || u === '') return cleanGrams(val);
      if (u === 'kg' || u === 'kilogramm') return cleanGrams(val * 1000);
      if (u === 'ml' || u === 'milliliter') return cleanGrams(val);
      if (u === 'l' || u === 'liter') return cleanGrams(val * 1000);

      // Löffel-Umrechnung anhand der vorhandenen Dichte-Tabelle
      const normName = normalizeName(ingredientName);
      const spoonRule = SPOON_CONVERSIONS.find((r) => r.keywords.some((kw) => normName.includes(kw)));
      if (u === 'el' || u === 'esslöffel') return cleanGrams(val * (spoonRule ? spoonRule.el : 15));
      if (u === 'tl' || u === 'teelöffel') return cleanGrams(val * (spoonRule ? spoonRule.tl : 5));
      if (u === 'prise' || u === 'prisen') return cleanGrams(val * 1);

      // Stück-Schätzung für typische Küchenzutaten
      if (u === 'stk' || u === 'stück' || u === 'st' || u === 'zehe' || u === 'zehen' || u === 'dose' || u === 'dosen' || u === 'packung' || u === 'pck') {
        if (u.startsWith('zehe') || normName.includes('knoblauch')) return cleanGrams(val * 5);
        if (u.startsWith('dose')) return cleanGrams(val * 400);
        if (normName.includes('ei')) return cleanGrams(val * 60);
        if (normName.includes('zwiebel')) return cleanGrams(val * 80);
        if (normName.includes('karotte') || normName.includes('möhre')) return cleanGrams(val * 70);
        if (normName.includes('paprika')) return cleanGrams(val * 150);
        if (normName.includes('tomate')) return cleanGrams(val * 100);
        return cleanGrams(val * 100);
      }

      return cleanGrams(val);
    }

    /**
     * Intelligenter Zutaten-Parser für strukturierte & freie CSV-Zutatenlisten:
     * Unterstützt z. B.:
     *  - "Hackfleisch:500:g | Zwiebeln:150:g"
     *  - "500 g Hackfleisch; 2 EL Olivenöl; 1 TL Salz"
     *  - Mehrzeilige Listen ("500g Hackfleisch\n150g Zwiebeln")
     */
    function parseSmartIngredients(rawText) {
      if (!rawText || !String(rawText).trim()) return [];
      const text = String(rawText).trim();

      // Trennzeichen bestimmen: |, Zeilenumbruch, ; oder Komma (wenn sinnvoll)
      let parts = [];
      if (text.includes('|')) {
        parts = text.split('|');
      } else if (text.includes('\n')) {
        parts = text.split(/\r?\n/);
      } else if (text.includes(';')) {
        parts = text.split(';');
      } else {
        // Komma-Trennung nur wenn nicht bloß Dezimalkomma (z. B. "1,5 TL")
        parts = text.split(/,(?!\d)/);
      }

      const result = [];
      parts.forEach((rawPart) => {
        const cleaned = rawPart.replace(/^[\-\*•\s]+/, '').trim();
        if (!cleaned) return;

        // Format 1: Strukturiert mit Doppelpunkt -> "Name:Menge:Einheit" oder "Name:Menge"
        if (cleaned.includes(':')) {
          const segs = cleaned.split(':').map((s) => s.trim());
          if (segs.length >= 2 && /\d/.test(segs[1])) {
            const name = segs[0];
            const numMatch = segs[1].match(/(\d+(?:[.,]\d+)?)\s*([a-zA-ZäöüÄÖÜß]*)/);
            if (name && numMatch) {
              const unit = segs[2] || numMatch[2] || 'g';
              const grams = convertToGrams(numMatch[1], unit, name);
              if (grams > 0) {
                result.push({ name, amountGrams: grams, category: guessIngredientCategory(name) });
                return;
              }
            }
          }
        }

        // Format 2: Menge am Anfang -> "500 g Hackfleisch", "2 EL Olivenöl", "1,5 TL Salz", "3 Eier"
        const leadingMatch = cleaned.match(/^(\d+(?:[.,]\d+)?)\s*(kg|g|gr|gramm|ml|l|liter|el|esslöffel|tl|teelöffel|stk\.?|stück|st\.?|zehen?|dosen?|prisen?|pck\.?|packung)?\s+(.+)$/i);
        if (leadingMatch) {
          const amount = leadingMatch[1];
          const unit = leadingMatch[2] || (/\b(eier?|zwiebeln?|knoblauch|paprika|karotten?)\b/i.test(leadingMatch[3]) ? 'stk' : 'g');
          const name = leadingMatch[3].trim();
          const grams = convertToGrams(amount, unit, name);
          if (name && grams > 0) {
            result.push({ name, amountGrams: grams, category: guessIngredientCategory(name) });
            return;
          }
        }

        // Format 3: Menge am Ende -> "Hackfleisch 500 g" oder "Zwiebeln (150 g)"
        const trailingMatch = cleaned.match(/^(.+?)\s*\(?(\d+(?:[.,]\d+)?)\s*(kg|g|gr|gramm|ml|l|liter|el|tl|stk\.?|stück)?\)?$/i);
        if (trailingMatch) {
          const name = trailingMatch[1].replace(/[:\-–]+$/, '').trim();
          const grams = convertToGrams(trailingMatch[2], trailingMatch[3] || 'g', name);
          if (name && grams > 0) {
            result.push({ name, amountGrams: grams, category: guessIngredientCategory(name) });
            return;
          }
        }

        // Fallback: Zutat ohne erkennbare Zahl -> Standard 100 g
        result.push({
          name: cleaned,
          amountGrams: 100,
          category: guessIngredientCategory(cleaned),
        });
      });

      return result;
    }

    /** Zerlegt eine Anleitungs-Spalte in saubere Einzelschritte */
    function parseSmartSteps(rawText) {
      if (!rawText || !String(rawText).trim()) return [];
      const text = String(rawText).trim();
      let parts = [];

      if (text.includes('||')) {
        parts = text.split('||');
      } else if (text.includes('|')) {
        parts = text.split('|');
      } else if (text.includes('\n')) {
        parts = text.split(/\r?\n/);
      } else if (/\b2\.\s+/.test(text)) {
        parts = text.split(/(?=\b\d+\.\s+)/);
      } else {
        parts = [text];
      }

      return parts
        .map((s) => s.replace(/^\d+[\.\)]\s*/, '').trim())
        .filter(Boolean);
    }

    /** Erzeugt Vorschau-Objekte anhand des aktuellen Spalten-Mappings */
    function buildImportPreview(importData) {
      if (!importData || importData.fileKind !== 'csv') return [];
      const { targetType, dataRows, mapping } = importData;

      if (targetType === 'pantry') {
        const items = [];
        dataRows.forEach((row) => {
          const name = mapping.name >= 0 ? (row[mapping.name] || '').trim() : '';
          if (!name) return;
          const rawAmount = mapping.amountGrams >= 0 ? row[mapping.amountGrams] : '100';
          const numMatch = String(rawAmount || '').match(/(\d+(?:[.,]\d+)?)\s*([a-zA-ZäöüÄÖÜß]*)/);
          const amountGrams = numMatch ? convertToGrams(numMatch[1], numMatch[2] || 'g', name) : 100;
          const rawCat = mapping.category >= 0 ? (row[mapping.category] || '').trim() : '';
          const matchedCat = PANTRY_CATEGORIES.find((c) => normalizeName(c) === normalizeName(rawCat));
          const category = matchedCat || guessIngredientCategory(name);
          const exists = Boolean(getPantryItemByName(name));

          items.push({ name, amountGrams, category, exists });
        });
        return items;
      }

      // Rezepte-Vorschau
      const items = [];
      dataRows.forEach((row) => {
        const name = mapping.name >= 0 ? (row[mapping.name] || '').trim() : '';
        if (!name) return;
        const description = mapping.description >= 0 ? (row[mapping.description] || '').trim() : '';
        const rawServings = mapping.defaultServings >= 0 ? parseInt(row[mapping.defaultServings], 10) : 4;
        const defaultServings = rawServings > 0 ? rawServings : 4;
        const rawTime = mapping.prepTimeMinutes >= 0 ? parseInt(row[mapping.prepTimeMinutes], 10) : 25;
        const prepTimeMinutes = rawTime > 0 ? rawTime : 25;

        const baseNameRaw = mapping.baseName >= 0 ? (row[mapping.baseName] || '').trim() : '';
        const matchedBase = baseNameRaw
          ? state.bases.find(
              (b) =>
                normalizeName(b.name) === normalizeName(baseNameRaw) ||
                normalizeName(b.name).includes(normalizeName(baseNameRaw))
            )
          : null;
        const rawBaseGrams = mapping.baseAmountGrams >= 0 ? parseFloat(String(row[mapping.baseAmountGrams] || '').replace(',', '.')) : 0;
        const baseAmountGrams = matchedBase ? (rawBaseGrams > 0 ? cleanGrams(rawBaseGrams) : matchedBase.yieldGrams || 400) : 0;

        const ingredients = parseSmartIngredients(mapping.ingredients >= 0 ? row[mapping.ingredients] : '');
        const steps = parseSmartSteps(mapping.steps >= 0 ? row[mapping.steps] : '');
        const exists = state.recipes.some((r) => normalizeName(r.name) === normalizeName(name));

        items.push({
          name,
          description,
          defaultServings,
          prepTimeMinutes,
          baseId: matchedBase ? matchedBase.id : null,
          baseLabel: matchedBase ? matchedBase.name : baseNameRaw ? `${baseNameRaw} (nicht gefunden)` : '',
          baseAmountGrams,
          ingredients,
          steps,
          exists,
        });
      });

      return items;
    }

    /** Liest eine hochgeladene Datei (.csv, .txt, .json) ein und aktualisiert das Import-Modal */
    function handleUploadedFile(file) {
      if (!file || !state.modal || state.modal.type !== 'import') return;
      const reader = new FileReader();

      reader.onload = (ev) => {
        const content = String(ev.target.result || '');
        const fileName = file.name || 'datei';
        const isJson = fileName.toLowerCase().endsWith('.json') || content.trim().startsWith('{');

        if (isJson) {
          try {
            const parsed = JSON.parse(content);
            if (!parsed || typeof parsed !== 'object') throw new Error('Ungültiges JSON');
            state.modal.data = {
              ...state.modal.data,
              fileName,
              fileKind: 'json',
              jsonPayload: parsed,
              jsonMode: 'merge',
              error: null,
            };
            renderModal();
            return;
          } catch (err) {
            state.modal.data.error = 'Die JSON-Datei konnte nicht gelesen werden. Bitte prüfe das Format.';
            renderModal();
            return;
          }
        }

        // CSV / TXT verarbeiten
        const delimiter = detectCSVDelimiter(content);
        const { headers, dataRows } = parseCSVText(content, delimiter);
        if (headers.length === 0 || dataRows.length === 0) {
          state.modal.data.error = 'Die Datei enthält keine verwertbaren Zeilen. Bitte prüfe die Datei.';
          renderModal();
          return;
        }

        const mapping = autoMapColumns(headers, state.modal.data.targetType);
        state.modal.data = {
          ...state.modal.data,
          fileName,
          fileKind: 'csv',
          rawText: content,
          delimiter,
          headers,
          dataRows,
          mapping,
          error: null,
        };
        renderModal();
      };

      reader.onerror = () => {
        if (state.modal && state.modal.type === 'import') {
          state.modal.data.error = 'Fehler beim Einlesen der Datei.';
          renderModal();
        }
      };

      reader.readAsText(file, 'UTF-8');
    }

    /** Führt den endgültigen Import (CSV oder JSON) aus und speichert in State & Cloud */
    async function executeImport() {
      if (!state.modal || state.modal.type !== 'import') return;
      const d = state.modal.data;

      // JSON-Backup Import
      if (d.fileKind === 'json' && d.jsonPayload) {
        const p = d.jsonPayload;
        const replace = d.jsonMode === 'replace';
        const importedBases = Array.isArray(p.bases) ? p.bases : [];
        const importedRecipes = Array.isArray(p.recipes) ? p.recipes : [];
        const importedPantry = Array.isArray(p.pantry) ? p.pantry : [];
        const importedPlan = Array.isArray(p.mealPlan) ? p.mealPlan : [];

        const mergeByName = (current, incoming, prefix) => {
          if (replace) return incoming.map((item) => ({ ...item, id: item.id || generateId(prefix) }));
          const next = [...current];
          incoming.forEach((item) => {
            const idx = next.findIndex((x) => normalizeName(x.name) === normalizeName(item.name));
            if (idx >= 0) next[idx] = { ...next[idx], ...item, id: next[idx].id };
            else next.push({ ...item, id: item.id || generateId(prefix) });
          });
          return next;
        };

        state.bases = mergeByName(state.bases, importedBases, 'base');
        state.recipes = mergeByName(state.recipes, importedRecipes, 'rec');
        state.pantry = mergeByName(state.pantry, importedPantry, 'pan');
        if (replace || state.mealPlan.length === 0) {
          state.mealPlan = importedPlan.map((m) => ({ ...m, id: m.id || generateId('mp') }));
        }

        closeModal();
        renderApp();

        await Promise.all([
          ...state.bases.map((b) => persistDoc('bases', b.id, b)),
          ...state.recipes.map((r) => persistDoc('recipes', r.id, r)),
          ...state.pantry.map((item) => persistDoc('pantry', item.id, item)),
          ...state.mealPlan.map((m) => persistDoc('mealPlan', m.id, m)),
        ]);

        showToast(`JSON-Backup erfolgreich importiert (${importedRecipes.length} Rezepte, ${importedPantry.length} Vorräte).`, 'success');
        return;
      }

      // CSV Import
      const preview = buildImportPreview(d);
      if (preview.length === 0) {
        showToast('Keine gültigen Einträge zum Importieren gefunden.', 'warn');
        return;
      }

      const updateDuplicates = d.duplicateMode === 'update';
      let addedCount = 0;
      let updatedCount = 0;
      const docsToSave = [];

      if (d.targetType === 'pantry') {
        const nextPantry = [...state.pantry];
        preview.forEach((item) => {
          const existingIdx = nextPantry.findIndex((p) => normalizeName(p.name) === normalizeName(item.name));
          if (existingIdx >= 0 && updateDuplicates) {
            const updated = {
              ...nextPantry[existingIdx],
              category: item.category,
              amountGrams: cleanGrams(item.amountGrams),
            };
            nextPantry[existingIdx] = updated;
            docsToSave.push(updated);
            updatedCount++;
          } else {
            const created = {
              id: generateId('pan'),
              name: item.name,
              category: item.category,
              amountGrams: cleanGrams(item.amountGrams),
            };
            nextPantry.push(created);
            docsToSave.push(created);
            addedCount++;
          }
        });

        state.pantry = nextPantry;
        closeModal();
        renderApp();
        await Promise.all(docsToSave.map((docItem) => persistDoc('pantry', docItem.id, docItem)));
        showToast(`Vorrat importiert: ${addedCount} neu, ${updatedCount} aktualisiert.`, 'success');
        return;
      }

      // Rezepte importieren
      const nextRecipes = [...state.recipes];
      preview.forEach((item) => {
        const existingIdx = nextRecipes.findIndex((r) => normalizeName(r.name) === normalizeName(item.name));
        const payload = {
          name: item.name,
          description: item.description,
          defaultServings: item.defaultServings,
          prepTimeMinutes: item.prepTimeMinutes,
          baseId: item.baseId,
          baseAmountGrams: item.baseAmountGrams,
          ingredients: item.ingredients,
          steps: item.steps,
        };

        if (existingIdx >= 0 && updateDuplicates) {
          const updated = { ...nextRecipes[existingIdx], ...payload };
          nextRecipes[existingIdx] = updated;
          docsToSave.push(updated);
          updatedCount++;
        } else {
          const created = { id: generateId('rec'), ...payload };
          nextRecipes.push(created);
          docsToSave.push(created);
          addedCount++;
        }
      });

      state.recipes = nextRecipes;
      closeModal();
      renderApp();
      await Promise.all(docsToSave.map((docItem) => persistDoc('recipes', docItem.id, docItem)));
      showToast(`Rezepte importiert: ${addedCount} neu, ${updatedCount} aktualisiert!`, 'success');
    }

    /** Hilfsfunktion zum Escapen einzelner CSV-Zellen */
    function escapeCSVCell(val) {
      const str = String(val === null || val === undefined ? '' : val);
      if (/[;"\n\r]/.test(str)) {
        return `"${str.replace(/"/g, '""')}"`;
      }
      return str;
    }

    /** Startet einen Datei-Download im Browser */
    function downloadFile(filename, content, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        a.remove();
        URL.revokeObjectURL(url);
      }, 150);
    }

    function exportRecipesCSV() {
      const header = ['Titel', 'Beschreibung', 'Portionen', 'Zeit_Min', 'Basis', 'Basis_Menge_g', 'Zutaten', 'Anleitung'];
      const rows = state.recipes.map((r) => {
        const base = r.baseId ? getBaseById(r.baseId) : null;
        const ingsStr = (r.ingredients || []).map((i) => `${i.name}:${cleanGrams(i.amountGrams)}:g`).join(' | ');
        const stepsStr = (r.steps || []).join(' | ');
        return [
          r.name,
          r.description || '',
          r.defaultServings || 4,
          r.prepTimeMinutes || 25,
          base ? base.name : '',
          base ? cleanGrams(r.baseAmountGrams) : '',
          ingsStr,
          stepsStr,
        ].map(escapeCSVCell).join(';');
      });
      const csv = '\uFEFF' + [header.join(';'), ...rows].join('\r\n');
      downloadFile('vorratskueche-rezepte.csv', csv, 'text/csv;charset=utf-8;');
      showToast('Rezepte als CSV-Datei exportiert.', 'success');
    }

    function exportPantryCSV() {
      const header = ['Name', 'Kategorie', 'Menge_g'];
      const rows = state.pantry
        .slice()
        .sort((a, b) => a.name.localeCompare(b.name, 'de'))
        .map((p) => [p.name, p.category, cleanGrams(p.amountGrams)].map(escapeCSVCell).join(';'));
      const csv = '\uFEFF' + [header.join(';'), ...rows].join('\r\n');
      downloadFile('vorratskueche-vorrat.csv', csv, 'text/csv;charset=utf-8;');
      showToast('Vorrat als CSV-Datei exportiert.', 'success');
    }

    /** Rendert das Import-Modal mit Drag-&-Drop, Spalten-Mapping und Live-Vorschau */
    function renderImportModalContent(m) {
      const targetType = m.targetType || 'recipes';
      const fields = targetType === 'pantry' ? PANTRY_MAPPING_FIELDS : RECIPE_MAPPING_FIELDS;
      const preview = m.fileKind === 'csv' ? buildImportPreview(m) : [];
      const previewSlice = preview.slice(0, 12);

      return `
        <div class="bg-cream-50 w-full max-w-4xl max-h-[92vh] rounded-3xl shadow-2xl border border-cream-300 flex flex-col overflow-hidden animate-fade-up">
          <!-- Header -->

                              <td class="py-2 px-3">

              ${(m.fileKind === 'csv' && preview.length > 0) || m.fileKind === 'json' ? '' : 'disabled'}

                (m.fileKind === 'csv' && preview.length > 0) || m.fileKind === 'json'
                  ? 'bg-sage-600 hover:bg-sage-700 text-white shadow-sm'

    function renderModal() {
      const root = document.getElementById('modal-root');
      if (!root) return;
      if (!state.modal) {
        root.classList.add('hidden');
        root.innerHTML = '';
        return;
      }

      let content = '';
      switch (state.modal.type) {
        case 'cook':
          content = renderCookModalContent(state.modal.data);
          break;
        case 'batchPrep':
          content = renderBatchPrepModalContent(state.modal.data);
          break;
        case 'addMeal':
          content = renderAddMealModalContent(state.modal.data);
          break;
        case 'pantry':
          content = renderPantryModalContent(state.modal.data);
          break;
        case 'recipe':
          content = renderRecipeModalContent(state.modal.data);
          break;
        case 'base':
          content = renderBaseModalContent(state.modal.data);
          break;
        case 'confirm':
          content = renderConfirmModalContent(state.modal.data);
          break;
        case 'storageInfo':
          content = renderStorageInfoModalContent();
          break;
        case 'import':
          content = renderImportModalContent(state.modal.data);
          break;
      }

      root.classList.remove('hidden');
      root.innerHTML = `
        <div id="modal-backdrop" class="fixed inset-0 bg-charcoal-900/50 backdrop-blur-xs flex items-center justify-center p-3 sm:p-5">
          ${content}
        </div>
      `;
    }

    // =========================================================================
    // 14. HAUPT-RENDERING & EVENT-DELEGATION
    // =========================================================================

    function renderApp() {
      if (!state.initialized) return;
      renderNavigation();

      const main = document.getElementById('app-main');
      if (!main) return;

      // Aktiven Input-Fokus merken (für flüssiges Tippen in Suchfeldern)
      const activeEl = document.activeElement;
      const activeId = activeEl && (activeEl.id === 'pantry-search-input' || activeEl.id === 'recipe-search-input') ? activeEl.id : null;
      const selStart = activeId ? activeEl.selectionStart : null;

      if (state.activeTab === 'week') {
        main.innerHTML = renderWeekView();
      } else if (state.activeTab === 'shopping') {
        main.innerHTML = renderShoppingView();
      } else if (state.activeTab === 'pantry') {
        main.innerHTML = renderPantryView();
      } else if (state.activeTab === 'recipes') {
        main.innerHTML = renderRecipesView();
      }

      if (activeId) {
        const restored = document.getElementById(activeId);
        if (restored) {
          restored.focus();
          if (selStart !== null) restored.setSelectionRange(selStart, selStart);
        }
      }

      if (state.modal) {
        renderModal();
      }
    }

    // Globale Click-Delegation
    document.addEventListener('click', (e) => {
      const target = e.target;

      // Klick auf Modal-Backdrop schließt das Modal
      if (target.id === 'modal-backdrop') {
        closeModal();
        return;
      }

      // Navigations-Tabs
      const navBtn = target.closest('[data-nav-tab]');
      if (navBtn) {
        state.activeTab = navBtn.dataset.navTab;
        renderApp();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      // Header-Buttons
      if (target.closest('#global-unit-toggle')) {
        state.showSpoons = !state.showSpoons;
        renderApp();
        persistSettings();
        return;
      }

      if (target.closest('#reset-demo-btn')) {
        openModal('storageInfo');
        return;
      }

      // Kochmodus-spezifische Aktionen
      const cookServBtn = target.closest('[data-cook-servings]');
      if (cookServBtn && state.modal && state.modal.type === 'cook') {
        state.modal.data.servings = Math.max(1, parseInt(cookServBtn.dataset.cookServings, 10) || 4);
        renderModal();
        return;
      }

      const cookToggleBtn = target.closest('[data-cook-toggle]');
      if (cookToggleBtn && state.modal && state.modal.type === 'cook') {
        const kind = cookToggleBtn.dataset.cookToggle;
        if (kind === 'base-ings') {
          state.modal.data.baseIngredientsCollapsed = !state.modal.data.baseIngredientsCollapsed;
        } else if (kind === 'base-steps') {
          state.modal.data.baseStepsCollapsed = !state.modal.data.baseStepsCollapsed;
        } else if (kind === 'all-base') {
          const allClosed = state.modal.data.baseIngredientsCollapsed && state.modal.data.baseStepsCollapsed;
          state.modal.data.baseIngredientsCollapsed = !allClosed;
          state.modal.data.baseStepsCollapsed = !allClosed;
        }
        renderModal();
        return;
      }

      const cookCheckBtn = target.closest('[data-cook-check]');
      if (cookCheckBtn && state.modal && state.modal.type === 'cook') {
        const kind = cookCheckBtn.dataset.cookCheck;
        const idx = cookCheckBtn.dataset.idx;
        const mapKey = {
          'base-ing': 'checkedBaseIngs',
          'main-ing': 'checkedMainIngs',
          'base-step': 'checkedBaseSteps',
          'main-step': 'checkedMainSteps',
        }[kind];
        if (mapKey) {
          state.modal.data[mapKey][idx] = !state.modal.data[mapKey][idx];
          renderModal();
        }
        return;
      }

      // Allgemeine Daten-Aktionen
      const actionBtn = target.closest('[data-action]');
      if (!actionBtn) return;

      const action = actionBtn.dataset.action;

      switch (action) {
        case 'close-modal':
          closeModal();
          break;

        case 'toggle-global-units':
          state.showSpoons = !state.showSpoons;
          renderApp();
          persistSettings();
          break;

        case 'open-cook':
          openCookModal(actionBtn.dataset.recipeId, actionBtn.dataset.servings);
          break;

        case 'open-batch-prep':
          openModal('batchPrep', {
            baseId: actionBtn.dataset.baseId,
            totalGrams: Number(actionBtn.dataset.totalGrams) || 400,
          });
          break;

        case 'open-add-meal':
          openModal('addMeal', {
            day: actionBtn.dataset.day || 'Montag',
            recipeId: actionBtn.dataset.recipeId || '',
          });
          break;

        case 'remove-meal':
          removeMealFromPlan(actionBtn.dataset.mealId);
          break;

        case 'toggle-prepped':
          togglePreppedBase(actionBtn.dataset.baseId);
          break;

        case 'set-suggestion-sort':
          state.suggestionSort = actionBtn.dataset.sort;
          renderApp();
          break;

        case 'toggle-mobile-suggestions':
          state.mobileSuggestionsOpen = !state.mobileSuggestionsOpen;
          renderApp();
          break;

        case 'quick-add-suggestion': {
          const recId = actionBtn.dataset.recipeId;
          const select = document.querySelector(`[data-suggestion-day="${recId}"]`);
          const day = select ? select.value : 'Dienstag';
          const rec = getRecipeById(recId);
          addMealToPlan(day, recId, rec ? rec.defaultServings : 4);
          break;
        }

        case 'toggle-shop-check':
          toggleShoppingCheck(actionBtn.dataset.norm);
          break;

        case 'toggle-force-buy':
          toggleForceBuy(actionBtn.dataset.norm, actionBtn.dataset.name);
          break;

        case 'book-checked':
          bookCheckedToPantry();
          break;

        case 'set-pantry-cat':
          state.pantryCategory = actionBtn.dataset.cat;
          renderApp();
          break;

        case 'adjust-pantry':
          adjustPantryAmount(actionBtn.dataset.id, Number(actionBtn.dataset.delta));
          break;

        case 'open-pantry-modal':
          openModal('pantry', { id: actionBtn.dataset.id || null });
          break;

        case 'confirm-delete-pantry': {
          const item = state.pantry.find((p) => p.id === actionBtn.dataset.id);
          if (!item) break;
          openModal('confirm', {
            title: 'Zutat aus Vorrat löschen?',
            message: `Möchtest du „${item.name}“ (${formatNumberDE(item.amountGrams, 0)} g) wirklich aus deiner Vorrats-Datenbank entfernen?`,
            confirmLabel: 'Löschen',
            danger: true,
            onConfirm: () => deletePantryItem(item.id),
          });
          break;
        }

        case 'set-recipes-subtab':
          state.recipesSubTab = actionBtn.dataset.subtab;
          renderApp();
          break;

        case 'set-recipe-base-filter':
          state.recipeBaseFilter = actionBtn.dataset.filter;
          renderApp();
          break;

        case 'open-recipe-modal':
          openModal('recipe', { id: actionBtn.dataset.id || null });
          break;

        case 'confirm-delete-recipe': {
          const rec = getRecipeById(actionBtn.dataset.id);
          if (!rec) break;
          openModal('confirm', {
            title: 'Rezept löschen?',
            message: `Soll „${rec.name}“ dauerhaft gelöscht werden? Eventuelle Einträge im Wochenplan werden ebenfalls entfernt.`,
            confirmLabel: 'Löschen',
            danger: true,
            onConfirm: () => deleteRecipe(rec.id),
          });
          break;
        }

        case 'open-base-modal':
          openModal('base', { id: actionBtn.dataset.id || null });
          break;

        case 'confirm-delete-base': {
          const base = getBaseById(actionBtn.dataset.id);
          if (!base) break;
          openModal('confirm', {
            title: 'Rezept-Basis löschen?',
            message: `Soll „${base.name}“ gelöscht werden? Verknüpfte Rezepte bleiben erhalten, verlieren aber die Basis-Zuordnung.`,
            confirmLabel: 'Löschen',
            danger: true,
            onConfirm: () => deleteBase(base.id),
          });
          break;
        }

        case 'confirm-reset-demo':
          openModal('confirm', {
            title: 'Beispieldaten zurücksetzen?',
            message: 'Alle aktuellen Vorräte, Rezepte, Basen und dein Wochenplan werden auf den realistischen Ausgangszustand zurückgesetzt.',
            confirmLabel: 'Zurücksetzen',
            danger: true,
            onConfirm: async () => {
              closeModal();
              await resetToSampleData();
            },
          });
          break;

        case 'execute-confirm':
          if (state.modal && state.modal.type === 'confirm' && typeof state.modal.data.onConfirm === 'function') {
            state.modal.data.onConfirm();
          }
          break;

        case 'add-ing-row': {
          const container = document.getElementById('form-ingredients-container');
          if (container) {
            container.insertAdjacentHTML('beforeend', createIngredientRowHTML());
          }
          break;
        }

        case 'add-step-row': {
          const container = document.getElementById('form-steps-container');
          if (container) {
            container.insertAdjacentHTML('beforeend', createStepRowHTML());
          }
          break;
        }

        case 'remove-form-row': {
          const row = actionBtn.closest('.ing-row, .step-row');
          if (row && row.parentElement && row.parentElement.children.length > 1) {
            row.remove();
          }
          break;
        }

        case 'open-import-modal':
          openModal('import', {
            targetType: actionBtn.dataset.importTarget || 'recipes',
            fileName: '',
            fileKind: null,
            rawText: '',
            delimiter: ';',
            headers: [],
            dataRows: [],
            mapping: {},
            duplicateMode: 'add',
            jsonPayload: null,
            jsonMode: 'merge',
            error: null,
          });
          break;

        case 'set-import-target':
          if (state.modal && state.modal.type === 'import') {
            const nextTarget = actionBtn.dataset.target;
            state.modal.data.targetType = nextTarget;
            if (state.modal.data.fileKind === 'csv' && state.modal.data.headers.length > 0) {
              state.modal.data.mapping = autoMapColumns(state.modal.data.headers, nextTarget);
            }
            renderModal();
          }
          break;

        case 'trigger-file-input': {
          const fileInput = document.getElementById('import-file-input');
          if (fileInput) fileInput.click();
          break;
        }

        case 'set-duplicate-mode':
          if (state.modal && state.modal.type === 'import') {
            state.modal.data.duplicateMode = actionBtn.dataset.mode;
            renderModal();
          }
          break;

        case 'set-json-mode':
          if (state.modal && state.modal.type === 'import') {
            state.modal.data.jsonMode = actionBtn.dataset.mode;
            renderModal();
          }
          break;

        case 'execute-import':
          executeImport();
          break;

        case 'export-recipes-csv':
          exportRecipesCSV();
          break;

        case 'export-pantry-csv':
          exportPantryCSV();
          break;

        case 'download-sample-csv':
          downloadSampleCSV(actionBtn.dataset.sampleType || 'recipes');
          break;

        case 'export-json-backup':
          exportJsonBackup();
          break;
      }
    });

    // Datei-Upload, Trennzeichen-Wechsel & Spalten-Mapping im Import-Modal
    document.addEventListener('change', (e) => {
      if (e.target.id === 'import-file-input') {
        const file = e.target.files && e.target.files[0];
        if (file) handleUploadedFile(file);
        return;
      }

      if (e.target.id === 'import-delimiter-select' && state.modal && state.modal.type === 'import') {
        const delim = e.target.value;
        const { headers, dataRows } = parseCSVText(state.modal.data.rawText, delim);
        state.modal.data.delimiter = delim;
        state.modal.data.headers = headers;
        state.modal.data.dataRows = dataRows;
        state.modal.data.mapping = autoMapColumns(headers, state.modal.data.targetType);
        renderModal();
        return;
      }

      if (e.target.dataset && e.target.dataset.mapField && state.modal && state.modal.type === 'import') {
        state.modal.data.mapping[e.target.dataset.mapField] = parseInt(e.target.value, 10);
        renderModal();
      }
    });

    // Drag & Drop Unterstützung für die Upload-Zone
    document.addEventListener('dragover', (e) => {
      const zone = e.target.closest('#import-drop-zone');
      if (!zone) return;
      e.preventDefault();
      zone.classList.add('border-sage-600', 'bg-sage-50');
    });

    document.addEventListener('dragleave', (e) => {
      const zone = e.target.closest('#import-drop-zone');
      if (!zone) return;
      zone.classList.remove('border-sage-600', 'bg-sage-50');
    });

    document.addEventListener('drop', (e) => {
      const zone = e.target.closest('#import-drop-zone');
      if (!zone) return;
      e.preventDefault();
      zone.classList.remove('border-sage-600', 'bg-sage-50');
      const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) handleUploadedFile(file);
    });

    // Live-Suche in Vorrat & Rezepten
    document.addEventListener('input', (e) => {
      if (e.target.id === 'pantry-search-input') {
        state.pantrySearch = e.target.value;
        renderApp();
      } else if (e.target.id === 'recipe-search-input') {
        state.recipeSearch = e.target.value;
        renderApp();
      }
    });

    // Formular-Submissions (Modals)
    document.addEventListener('submit', (e) => {
      const form = e.target;

      if (form.id === 'add-meal-form') {
        e.preventDefault();
        const fd = new FormData(form);
        closeModal();
        addMealToPlan(fd.get('day'), fd.get('recipeId'), fd.get('servings'));
        return;
      }

      if (form.id === 'pantry-form') {
        e.preventDefault();
        const fd = new FormData(form);
        savePantryItem({
          id: fd.get('id') || null,
          name: fd.get('name'),
          category: fd.get('category'),
          amountGrams: fd.get('amountGrams'),
        });
        return;
      }

      if (form.id === 'recipe-form') {
        e.preventDefault();
        const fd = new FormData(form);
        const ingredients = Array.from(form.querySelectorAll('.ing-row')).map((row) => ({
          name: row.querySelector('[data-field="name"]').value,
          amountGrams: row.querySelector('[data-field="amountGrams"]').value,
          category: row.querySelector('[data-field="category"]').value,
        }));
        const steps = Array.from(form.querySelectorAll('.step-row')).map(
          (row) => row.querySelector('[data-field="step"]').value
        );

        saveRecipe({
          id: fd.get('id') || null,
          name: fd.get('name'),
          description: fd.get('description'),
          defaultServings: fd.get('defaultServings'),
          prepTimeMinutes: fd.get('prepTimeMinutes'),
          baseId: fd.get('baseId') || null,
          baseAmountGrams: fd.get('baseAmountGrams'),
          ingredients,
          steps,
        });
        return;
      }

      if (form.id === 'base-form') {
        e.preventDefault();
        const fd = new FormData(form);
        const ingredients = Array.from(form.querySelectorAll('.ing-row')).map((row) => ({
          name: row.querySelector('[data-field="name"]').value,
          amountGrams: row.querySelector('[data-field="amountGrams"]').value,
          category: row.querySelector('[data-field="category"]').value,
        }));
        const steps = Array.from(form.querySelectorAll('.step-row')).map(
          (row) => row.querySelector('[data-field="step"]').value
        );

        saveBase({
          id: fd.get('id') || null,
          name: fd.get('name'),
          description: fd.get('description'),
          yieldGrams: fd.get('yieldGrams'),
          ingredients,
          steps,
        });
        return;
      }
    });

    // Escape-Taste schließt offene Modals
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && state.modal) {
        closeModal();
      }
    });

    // =========================================================================
    // 15. APP STARTEN
    // =========================================================================
    initAppStorage();
  </script>
</body>
</html>
